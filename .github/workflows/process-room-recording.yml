name: Process Room Recording

on:
  repository_dispatch:
    types: [process_room]
  workflow_dispatch:
    inputs:
      room_id:
        description: 'PlugNmeet room_id to process (e.g. orbit-<schedule-id>). Leave blank to run one of the cleanup jobs instead (see cleanup_target below).'
        required: false
      cleanup_target:
        description: 'Manual cleanup run only (leave room_id blank): which cleanup to run'
        required: false
        default: 'stale_markers'
        type: choice
        options:
          - stale_markers
          - expired_recordings
      stale_marker_days:
        description: 'Manual stale_markers cleanup only: delete a room''s last-processed marker if untouched for at least this many days'
        required: false
        default: '90'
      recordings_dry_run:
        description: 'Manual expired_recordings cleanup only: report what would be deleted without actually deleting anything from R2/the DB'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  # Two independent sweeps, told apart at runtime via github.event.schedule
  # (the exact cron string that fired) - see the two cleanup jobs below:
  #  - weekly: deletes long-untouched room markers/ objects in R2.
  #  - daily: deletes recordings whose admin-configured retention period
  #    (set when the session was scheduled) has elapsed.
  schedule:
    - cron: '17 3 * * 0'
    - cron: '43 4 * * *'

permissions:
  contents: read

jobs:
  process:
    # repository_dispatch always means "process this room". A manual
    # workflow_dispatch run means the same ONLY if a room_id was
    # actually given - leaving it blank is how a person triggers the
    # cleanup job below by hand instead, so don't run this job then.
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.room_id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROOM_ID: ${{ github.event.client_payload.room_id || github.event.inputs.room_id }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      LIVEKIT_HOST: ${{ secrets.LIVEKIT_HOST }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      RECORDER_HOOK_SECRET: ${{ secrets.RECORDER_HOOK_SECRET }}
    steps:
      - name: Validate inputs
        run: |
          if [[ -z "${ROOM_ID:-}" ]]; then
            echo "::error::No room_id provided (repository_dispatch client_payload.room_id or workflow_dispatch input.room_id)"
            exit 1
          fi
          : "${R2_ACCOUNT_ID:?missing secret R2_ACCOUNT_ID}"
          : "${R2_ACCESS_KEY_ID:?missing secret R2_ACCESS_KEY_ID}"
          : "${R2_SECRET_ACCESS_KEY:?missing secret R2_SECRET_ACCESS_KEY}"
          : "${R2_BUCKET_NAME:?missing secret R2_BUCKET_NAME}"
          : "${LIVEKIT_API_KEY:?missing secret LIVEKIT_API_KEY}"
          : "${LIVEKIT_API_SECRET:?missing secret LIVEKIT_API_SECRET}"
          : "${SUPABASE_URL:?missing secret SUPABASE_URL}"
          : "${RECORDER_HOOK_SECRET:?missing secret RECORDER_HOOK_SECRET}"
          echo "Processing room: $ROOM_ID"

      - name: Install ffmpeg, rclone, bc (jq/curl/openssl/python3 already on runner)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg bc
          curl https://rclone.org/install.sh | sudo bash
          for bin in ffmpeg ffprobe rclone jq curl openssl python3 bc; do
            command -v "$bin" >/dev/null 2>&1 || { echo "::error::missing tool: $bin"; exit 1; }
          done

      # Deliberately -uo pipefail, NOT -e (matches process_room.sh's own
      # `set -u; set -o pipefail` exactly) - several steps below capture a
      # command's exit code into $rc on the line AFTER running it (e.g. the
      # rclone download loop), which only works if a non-zero exit doesn't
      # abort the shell immediately the way GitHub Actions' *default* bash
      # invocation (`bash --noprofile --norc -eo pipefail`) would.
      - name: Composite, compress, upload, register, clean up
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          LIVEKIT_HOST="${LIVEKIT_HOST:-https://meet.nouscomplex.com/livekit}"
          LIVEKIT_HOST="${LIVEKIT_HOST%/}"

          log() { echo "[$(date -u +%H:%M:%S)] $*"; }
          fail() { log "FATAL: $*"; exit 1; }

          log "==== processing room: $ROOM_ID ===="

          WORKDIR="${RUNNER_TEMP}/${ROOM_ID}_$(date -u +%s)"
          mkdir -p "$WORKDIR"
          log "workdir: $WORKDIR"

          RCLONE_REMOTE="nouscomplex_r2_pipeline"
          RCLONE_CONF="${WORKDIR}/rclone.conf"
          cat > "$RCLONE_CONF" <<EOF
          [$RCLONE_REMOTE]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          no_check_bucket = true
          no_head = true
          acl =
          EOF
          chmod 600 "$RCLONE_CONF"
          rclone_() { rclone --config "$RCLONE_CONF" "$@"; }

          # ---- LiveKit Egress API (over the public endpoint - this runner
          # has no access to the Oracle box's localhost) ----
          livekit_jwt() {
            local now exp header_b64 payload_b64 signing_input sig_b64
            now=$(date +%s)
            exp=$((now + 600))
            header_b64=$(printf '{"alg":"HS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            payload_b64=$(python3 -c "
          import json,sys
          print(json.dumps({
            'iss': '$LIVEKIT_API_KEY',
            'sub': 'orbit-recording-pipeline-gha',
            'nbf': $now - 5,
            'exp': $exp,
            'video': {'roomRecord': True},
          }))" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            signing_input="${header_b64}.${payload_b64}"
            sig_b64=$(printf '%s' "$signing_input" | openssl dgst -sha256 -hmac "$LIVEKIT_API_SECRET" -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            printf '%s.%s' "$signing_input" "$sig_b64"
          }

          # Retries transient network failures (e.g. the "Recv failure:
          # Connection reset by peer" seen against the LiveKit host) up to 3
          # times before giving up. Always just returns whatever it got -
          # callers that need to treat an empty/invalid response as fatal
          # check for that explicitly (see the FINAL_JSON validation below),
          # rather than this function silently deciding what's fatal for
          # every caller (StopEgress calls are fine to just skip on failure).
          livekit_call() {
            local method="$1" body="$2" token attempt response rc
            token=$(livekit_jwt)
            for attempt in 1 2 3; do
              response=$(curl -sS --max-time 30 -X POST "${LIVEKIT_HOST}/twirp/livekit.Egress/${method}" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${token}" \
                -d "$body")
              rc=$?
              if [[ $rc -eq 0 && -n "$response" ]] && echo "$response" | jq empty >/dev/null 2>&1; then
                echo "$response"
                return 0
              fi
              log "WARNING: livekit_call $method attempt $attempt/3 failed (curl exit=$rc) or returned invalid JSON - retrying in 3s..."
              sleep 3
            done
            log "WARNING: livekit_call $method failed after 3 attempts - returning empty."
            echo ""
          }

          log "listing egress for room..."
          LIST_JSON=$(livekit_call ListEgress "$(jq -n --arg room_name "$ROOM_ID" '{room_name: $room_name}')")
          echo "$LIST_JSON" > "${WORKDIR}/list_egress_initial.json"

          echo "$LIST_JSON" | jq -c '.items // [] | .[] | select((.ended_at // 0) == 0)' | while read -r item; do
            egress_id=$(echo "$item" | jq -r '.egress_id')
            log "stopping still-active egress $egress_id"
            livekit_call StopEgress "$(jq -n --arg id "$egress_id" '{egress_id: $id}')" > /dev/null || true
          done

          sleep 5

          log "re-listing egress for final file results..."
          FINAL_JSON=$(livekit_call ListEgress "$(jq -n --arg room_name "$ROOM_ID" '{room_name: $room_name}')")
          echo "$FINAL_JSON" > "${WORKDIR}/list_egress_final.json"

          # This call is critical: if it comes back empty/invalid (e.g. a
          # transient network reset talking to the LiveKit host) we must NOT
          # silently treat that the same as "genuinely zero egress jobs" -
          # that previously caused the workflow to exit 0 having done
          # nothing, with no compressed MP4 ever produced and no indication
          # anything went wrong. Fail loudly instead; raw files are
          # untouched in R2 (cleanup never runs before this point), so simply
          # re-running the workflow once LiveKit is reachable again is safe.
          if ! echo "$FINAL_JSON" | jq empty >/dev/null 2>&1; then
            fail "ListEgress (final) returned no valid response after retries - likely a transient network issue reaching LiveKit. Raw per-track files are still safely in R2 (nothing was deleted). Re-run this workflow (Run workflow, not Re-run jobs) once LiveKit is reachable."
          fi

          ITEM_COUNT=$(echo "$FINAL_JSON" | jq '.items // [] | length')
          if [[ "$ITEM_COUNT" -eq 0 ]]; then
            log "no egress jobs found for this room - nothing to process. Exiting cleanly."
            rm -rf "$WORKDIR"
            exit 0
          fi
          log "found $ITEM_COUNT egress job(s)"

          # LiveKit's ListEgress returns EVERY egress job ever run for this
          # room_name, not just ones from the current session - confirmed
          # directly: reprocessing the same test room a second time picked
          # up the first run's already-composited tracks again and merged
          # them into the new video (visible as a bogus "sync anchor" from
          # the earlier run and a total duration spanning both sessions).
          # A marker file in R2 remembers the newest `ended_at` this room
          # has successfully finished processing through, so a re-run (or a
          # genuinely reused room, e.g. a recurring weekly class) only
          # picks up tracks that are actually new. It's written only after
          # a fully successful run below, so a run that fails partway
          # through leaves it untouched and nothing already-seen is lost.
          MARKER_KEY="markers/${ROOM_ID}/last_processed_ended_at.txt"
          LAST_PROCESSED_ENDED_AT="0"
          if rclone_ cat "${RCLONE_REMOTE}:${R2_BUCKET_NAME}/${MARKER_KEY}" > "${WORKDIR}/marker.txt" 2>/dev/null; then
            LAST_PROCESSED_ENDED_AT=$(tr -d '[:space:]' < "${WORKDIR}/marker.txt")
            [[ -z "$LAST_PROCESSED_ENDED_AT" ]] && LAST_PROCESSED_ENDED_AT="0"
          fi
          log "last-processed marker for this room: ended_at <= ${LAST_PROCESSED_ENDED_AT} already handled"
          MAX_ENDED_SEEN="0"

          extract_result_key() {
            echo "$1" | jq -r '(.file_results // [])[0] | (.filename // .file // .location // empty)'
          }

          normalize_epoch_seconds() {
            local v="$1"
            if [[ -z "$v" || "$v" == "0" ]]; then echo 0; return; fi
            if (( v > 1000000000000 )); then
              echo "scale=3; $v / 1000000000" | bc
            else
              echo "$v"
            fi
          }

          # ffmpeg's atempo filter only accepts a tempo change within
          # [0.5, 2.0] per stage - anything outside that (which a badly
          # drifted track can easily need) has to be expressed as a chain of
          # in-range stages whose product is the real target.
          build_atempo_chain() {
            local target="$1" chain=""
            while (( $(echo "$target > 2.0" | bc -l) )); do
              chain="${chain}atempo=2.0,"
              target=$(echo "scale=6; $target / 2.0" | bc)
            done
            while (( $(echo "$target < 0.5" | bc -l) )); do
              chain="${chain}atempo=0.5,"
              target=$(echo "scale=6; $target / 0.5" | bc)
            done
            chain="${chain}atempo=${target}"
            echo "$chain"
          }

          # bc prints a fraction under 1 with no leading digit before the
          # decimal point (e.g. ".506006", or "-.5"), which is perfectly
          # valid to bc itself and to ffmpeg filter expressions like
          # between(t,.5,1) - but ffmpeg's *duration*-typed CLI/filter
          # options (-itsoffset, tpad's stop_duration, -t, etc.) are parsed
          # with the stricter av_parse_time, which rejects a bare leading
          # dot outright ("Unable to parse option value ... as duration"),
          # aborting the whole ffmpeg run with no composite produced at
          # all. Anywhere a bc result feeds one of those options, it has to
          # go through this first.
          fix_duration_leading_zero() {
            local v="$1"
            case "$v" in
              .*) echo "0${v}" ;;
              -.*) echo "-0${v#-}" ;;
              *) echo "$v" ;;
            esac
          }

          declare -a RAW_KEYS=()
          declare -a LOCAL_FILES=()
          declare -a SOURCES=()
          declare -a TYPES=()
          declare -a STARTS=()
          declare -a ENDS=()

          echo "$FINAL_JSON" | jq -c '.items // [] | .[]' > "${WORKDIR}/items.ndjson"
          while IFS= read -r item; do
            if ! echo "$item" | jq empty >/dev/null 2>&1; then
              # This item's own JSON is not even parseable - distinct from
              # "parsed fine, just no filename field" below. Seen exactly
              # once in practice, caused by a subprocess earlier in this
              # same loop iteration reading from stdin and stealing bytes
              # from this file out from under `read` (see the -nostdin
              # comment on the normalization ffmpeg call above) - logging
              # the length here is a quick way to confirm/rule that out if
              # it ever recurs.
              log "WARNING: a line from items.ndjson was not valid JSON (length ${#item} chars) - skipping it. Raw: $item"
              continue
            fi
            started_raw=$(echo "$item" | jq -r '.started_at // 0')
            started=$(normalize_epoch_seconds "$started_raw")
            ended_raw=$(echo "$item" | jq -r '.ended_at // 0')
            ended=$(normalize_epoch_seconds "$ended_raw")

            # Track the newest ended_at across every item this run has seen
            # at all (whether or not it ends up used), so the marker
            # written at the end of a successful run reflects everything
            # LiveKit reported this time - see the marker comment above.
            if [[ "$ended" != "0" ]] && (( $(echo "$ended > $MAX_ENDED_SEEN" | bc -l) )); then
              MAX_ENDED_SEEN="$ended"
            fi
            if [[ "$ended" != "0" ]] && (( $(echo "$ended <= $LAST_PROCESSED_ENDED_AT" | bc -l) )); then
              skip_track_id=$(echo "$item" | jq -r '.track.track_id // "unknown"')
              log "skipping already-processed egress (ended_at=$ended <= marker=$LAST_PROCESSED_ENDED_AT) - track_id=$skip_track_id"
              continue
            fi

            key=$(extract_result_key "$item")
            if [[ -z "$key" ]]; then
              log "WARNING: an egress item had no discoverable output filename - skipping it. Full item (pretty-printed so nothing gets lost on one huge line):"
              echo "$item" | jq .
              continue
            fi

            base=$(basename "$key")
            base_noext="${base%.*}"
            identity=$(echo "$base_noext" | awk -F'__' '{print $1}')
            source_v=$(echo "$base_noext" | awk -F'__' '{print $2}')
            type_v=$(echo "$base_noext" | awk -F'__' '{print $3}')

            local_file="${WORKDIR}/raw_$(echo "$base" | tr -c 'a-zA-Z0-9._-' '_')"
            log "downloading r2://${R2_BUCKET_NAME}/${key} -> ${local_file}"
            rclone_ copyto "${RCLONE_REMOTE}:${R2_BUCKET_NAME}/${key}" "$local_file"
            rc=$?
            if [[ $rc -ne 0 || ! -s "$local_file" ]]; then
              log "WARNING: could not download $key (rclone exit=$rc) - skipping this track"
              rm -f "$local_file"
              continue
            fi

            # Normalize every VIDEO track to a constant resolution/frame rate
            # BEFORE it ever reaches the main compositing filter graph.
            # Root cause this fixes: a LiveKit camera Track Egress can
            # genuinely change resolution mid-recording (observed directly:
            # one participant's raw camera .webm was 120x90 for the first
            # ~290s, then jumped to 640x480 for the rest - almost certainly
            # a simulcast layer switch as their bandwidth/CPU conditions
            # changed). ffmpeg's scale/overlay filters are built assuming a
            # fixed input size for the life of the stream; they don't
            # recover cleanly from a resolution change partway through, and
            # in a complex multi-stage overlay graph like this one, that
            # single input a breaking silently took down that participant's
            # WHOLE remaining contribution to the composite - both their
            # corner tile during a screen-share/whiteboard window and their
            # full-frame view afterwards, leaving a plain blank canvas
            # instead where their camera should have been. Re-encoding each
            # video track once, up front, to a fixed 1280x720/30fps here
            # means the main filter graph never sees a resolution change at
            # all, regardless of what the raw capture did.
            if [[ "$type_v" == "VIDEO" ]]; then
              norm_file="${local_file}_norm.mp4"
              # -nostdin (and redirecting stdin from /dev/null as a belt-
              # and-braces second layer) is NOT optional here: this whole
              # block runs inside `while read -r item; do ... done <
              # items.ndjson`, so without it ffmpeg inherits that same
              # loop's stdin - i.e. the *file descriptor reading
              # items.ndjson* - and its usual "poll stdin for interactive
              # keypresses" behavior silently steals bytes from whatever
              # item comes next in that file. That exact bug was caught
              # live: it corrupted the start of the next egress item's JSON
              # (the item literally started reading mid-way through, e.g.
              # from `Nw","room_id":...` instead of `{"egress_id":"EG_...
              # Nw","room_id":...`), which made `extract_result_key` fail
              # on perfectly valid data and silently drop that track (once
              # a stale duplicate recording, once a real screen-share) -
              # nothing to do with LiveKit or the JSON shape, purely this
              # missing flag.
              # crf 16 (not the 20 used for the final deliverable) because
              # this file is a throwaway intermediate that the main
              # compositing pass below will re-encode again at crf 20 - two
              # lossy generations in a row otherwise compounds more visible
              # quality loss than a single pass, and the extra disk space
              # here costs nothing since it's deleted with the rest of the
              # workdir at the end of the job.
              if ffmpeg -y -hide_banner -loglevel warning -nostdin -i "$local_file" \
                   -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30" \
                   -c:v libx264 -preset veryfast -crf 16 -pix_fmt yuv420p -an \
                   "$norm_file" </dev/null && [[ -s "$norm_file" ]]; then
                log "normalized $key to constant 1280x720/30fps -> ${norm_file}"
                local_file="$norm_file"
              else
                log "WARNING: normalization failed for $key - using raw file as-is (may hit the mid-stream-resolution-change bug if this file has one)"
                rm -f "$norm_file"
              fi
            fi

            RAW_KEYS+=("$key")
            LOCAL_FILES+=("$local_file")
            SOURCES+=("$source_v")
            TYPES+=("$type_v")
            STARTS+=("$started")
            ENDS+=("$ended")
          done < "${WORKDIR}/items.ndjson"

          if [[ "${#LOCAL_FILES[@]}" -eq 0 ]]; then
            log "no raw files could be downloaded - nothing to compress."
            exit 0
          fi

          # ---- Split the surviving items back into distinct sessions ----
          # LiveKit's ListEgress returns every egress job ever run for this
          # room NAME, and the marker above only stops us reprocessing
          # tracks a PREVIOUS successful run already finished - it does
          # nothing about tracks that are new to this run but actually
          # belong to several different, unrelated recordings that happened
          # to share a room name before this pipeline ever ran against it
          # (a genuinely recurring/weekly room, or a backlog of short test
          # recordings that piled up while earlier bugs here were being
          # fixed). Confirmed directly causing a real bug: a ~2 minute
          # meeting came out as a ~39 minute video because 14 egress jobs
          # from 4 unrelated recordings, spanning almost 40 minutes of
          # wall-clock time with multi-minute gaps between them, all got
          # merged into one timeline. Clustering by gap size splits them
          # back into their true sessions and produces one correctly-scoped
          # output per session instead of one bogus combined one - this is
          # NOT a rare edge case: it is exactly what happens the very first
          # time this marker-based code ever runs against any room that
          # already has unprocessed history sitting in LiveKit.
          SESSION_GAP_SECONDS=240

          : > "${WORKDIR}/sortable_starts.txt"
          for i in "${!LOCAL_FILES[@]}"; do
            printf '%s\t%s\n' "${STARTS[$i]}" "$i" >> "${WORKDIR}/sortable_starts.txt"
          done
          sort -n -k1,1 "${WORKDIR}/sortable_starts.txt" > "${WORKDIR}/sorted_starts.txt"

          declare -a CLUSTER_OF=()
          CLUSTER_COUNT=0
          CLUSTER_RUNNING_END=""
          while IFS=$'\t' read -r s_val idx; do
            if [[ -z "$CLUSTER_RUNNING_END" ]] || (( $(echo "$s_val - $CLUSTER_RUNNING_END > $SESSION_GAP_SECONDS" | bc -l) )); then
              CLUSTER_COUNT=$((CLUSTER_COUNT + 1))
              CLUSTER_RUNNING_END=""
            fi
            CLUSTER_OF[$idx]=$CLUSTER_COUNT
            this_end="${ENDS[$idx]}"
            [[ "$this_end" == "0" ]] && this_end="$s_val"
            if [[ -z "$CLUSTER_RUNNING_END" ]] || (( $(echo "$this_end > $CLUSTER_RUNNING_END" | bc -l) )); then
              CLUSTER_RUNNING_END="$this_end"
            fi
          done < "${WORKDIR}/sorted_starts.txt"
          log "split ${#LOCAL_FILES[@]} surviving track(s) into $CLUSTER_COUNT distinct session(s) (gap threshold ${SESSION_GAP_SECONDS}s)"

          # This ratchets up after each session below finishes uploading and
          # registering successfully, and is what actually gets written to
          # R2 as the new marker for each session - so if session 2 of 3
          # fails, session 1's marker advance already happened and a retry
          # of this workflow run will not re-upload/re-register it a second
          # time; only sessions 2 and 3 get retried.
          MARKER_FLOOR="$LAST_PROCESSED_ENDED_AT"
          OUTPUT_SUMMARY=()

          for (( cluster_num=1; cluster_num<=CLUSTER_COUNT; cluster_num++ )); do
            declare -a CL_IDX=()
            for i in "${!LOCAL_FILES[@]}"; do
              [[ "${CLUSTER_OF[$i]}" == "$cluster_num" ]] && CL_IDX+=("$i")
            done

            declare -a C_LOCAL_FILES=() C_SOURCES=() C_TYPES=() C_STARTS=() C_ENDS=()
            for i in "${CL_IDX[@]}"; do
              C_LOCAL_FILES+=("${LOCAL_FILES[$i]}")
              C_SOURCES+=("${SOURCES[$i]}")
              C_TYPES+=("${TYPES[$i]}")
              C_STARTS+=("${STARTS[$i]}")
              C_ENDS+=("${ENDS[$i]}")
            done
            log "---- session $cluster_num/$CLUSTER_COUNT: ${#C_LOCAL_FILES[@]} track(s) ----"

            EARLIEST_START="${C_STARTS[0]}"
            for s in "${C_STARTS[@]}"; do
              if (( $(echo "$s < $EARLIEST_START" | bc -l) )); then EARLIEST_START="$s"; fi
            done
            log "session $cluster_num sync anchor (earliest track start): $EARLIEST_START"

            FFMPEG_INPUTS=()
            FILTER_PARTS=()
            TOTAL_DURATION=0
            INPUT_IDX=1

            declare -a OFFSETS=() DURATIONS=() STRETCH=() STRETCHED_DURATIONS=()
            for i in "${!C_LOCAL_FILES[@]}"; do
              f="${C_LOCAL_FILES[$i]}"
              dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" 2>/dev/null || echo 0)
              [[ -z "$dur" || "$dur" == "N/A" ]] && dur=0
              offset=$(echo "${C_STARTS[$i]} - $EARLIEST_START" | bc)
              (( $(echo "$offset < 0" | bc -l) )) && offset=0
              # This feeds -itsoffset (a duration-typed ffmpeg option)
              # further below, in addition to plain filter-expression use -
              # see fix_duration_leading_zero above.
              offset=$(fix_duration_leading_zero "$offset")
              OFFSETS+=("$offset")
              DURATIONS+=("$dur")

              # ---- Never change this track's own playback speed ----
              #
              # Earlier revisions compared this track's PROBED file
              # duration against how much real wall-clock time LiveKit says
              # elapsed between started_at and ended_at for its egress job,
              # and treated any gap as encoder drift - "fixed" by literally
              # changing the track's PLAYBACK SPEED (setpts/atempo) to
              # stretch its content across the full wall-clock span.
              # Measured directly against a real delivered recording
              # (cross-correlating the finished video's own audio envelope
              # against camera motion, frame by frame): a camera track
              # stretched by a measured "drift" of 4.5% did not resync
              # anything - the video fell increasingly further BEHIND its
              # own audio the longer playback went on (about 1.2s late in
              # the first half of the clip, about 1.6s late in the second
              # half - almost exactly the 4.5% stretch itself, compounding
              # over time). A gap that produces a worse result the more a
              # speed correction is applied to it isn't a constant-rate
              # clock mismatch in the first place - the mismatch is on the
              # measurement side (LiveKit's own egress start/stop
              # bookkeeping, or simply how long a presenter leaves
              # something open after the last real change, padding
              # wall_span with time that was never real content), not a
              # camera/mic actually running fast or slow.
              #
              # So this track's own speed is never changed anymore.
              # STRETCH[i] stays permanently "1" (every setpts/atempo
              # expression downstream that multiplies by it is therefore a
              # harmless no-op, left in place rather than torn out
              # everywhere it's used, since an obviously-inert constant is
              # far lower-risk than a larger rewrite). The only adjustment
              # left is STRETCHED_DURATIONS[i]: this track is trusted to
              # already be paced correctly and simply capped at whatever
              # wall-clock span was actually available to it, so it can
              # never be treated as running into the next track's own
              # start time. Whatever's left over below that cap - because
              # the real content simply ended first, same as a presenter
              # actually turning their camera off or ending a share early -
              # is filled the same way any other gap between full-frame
              # sources already is (the HOLD mechanism below), or is simply
              # the moment a camera/mic-like track stops being shown/heard.
              wall_span_note=""
              stretch_factor="1"
              # Below this, wall_span itself is too short to be a reliable
              # reference at all - LiveKit's own start/stop bookkeeping
              # (job spin-up/teardown, timestamp rounding) is typically a
              # second or more, so on a sub-3s clip that alone can look
              # like a large mismatch with no real content gap behind it.
              MIN_DRIFT_CORRECTION_DURATION=3
              stretched_dur="$dur"
              if [[ "${C_ENDS[$i]}" != "0" && "${C_STARTS[$i]}" != "0" ]]; then
                wall_span=$(echo "${C_ENDS[$i]} - ${C_STARTS[$i]}" | bc)
                if (( $(echo "$wall_span > 0" | bc -l) )) && (( $(echo "$dur > 0" | bc -l) )); then
                  drift_pct=$(echo "scale=2; (($dur - $wall_span) / $wall_span) * 100" | bc)
                  wall_span_note=" wall_span=${wall_span}s gap=${drift_pct}%"
                  if (( $(echo "$dur < $MIN_DRIFT_CORRECTION_DURATION" | bc -l) )) || (( $(echo "$wall_span < $MIN_DRIFT_CORRECTION_DURATION" | bc -l) )); then
                    wall_span_note="${wall_span_note} <-- too short for wall_span to be reliable; kept at its own native length"
                  elif (( $(echo "$dur > $wall_span" | bc -l) )); then
                    stretched_dur="$wall_span"
                    wall_span_note="${wall_span_note} <-- ran past its own wall-clock span; trimmed to it, still at native speed"
                  else
                    wall_span_note="${wall_span_note} <-- kept at native speed (no longer stretched to fill the gap - see comment above)"
                  fi
                fi
              else
                wall_span_note=" wall_span=unavailable(no ended_at from LiveKit)"
              fi
              STRETCH+=("$stretch_factor")
              STRETCHED_DURATIONS+=("$stretched_dur")

              end=$(echo "$offset + $stretched_dur" | bc)
              if (( $(echo "$end > $TOTAL_DURATION" | bc -l) )); then TOTAL_DURATION="$end"; fi

              log "session $cluster_num track[$i] source=${C_SOURCES[$i]} type=${C_TYPES[$i]} offset=${offset}s duration=${dur}s${wall_span_note}"
            done
            TOTAL_DURATION=$(echo "($TOTAL_DURATION + 2) / 1" | bc)
            [[ "$TOTAL_DURATION" -lt 1 ]] && TOTAL_DURATION=5
            log "session $cluster_num total composed duration: ${TOTAL_DURATION}s"

            # ---- Lock a SCREEN_SHARE_AUDIO track to its own video, instead
            # of drift-correcting it independently ----
            #
            # LiveKit egresses a screen share's video and its accompanying
            # system audio as two SEPARATE tracks, each with its own
            # started_at/ended_at and its own probed file duration - so each
            # one gets its OWN independent drift measurement above. In a
            # real run those two measurements came out different (video:
            # -7% -> stretched by 1.086746; audio: -2%, left unstretched)
            # for what is supposed to be the exact same real-time window,
            # and with a starting offset that already differed by ~0.7s
            # before either correction was even applied. Correcting them
            # separately means they only coincidentally start together and
            # then drift apart from each other for the rest of the share -
            # on that real ~50s segment the two ends up roughly 3 seconds
            # apart, so the shared audio keeps playing (or cuts out) while
            # the video has already moved on to something else - reported
            # as the shared audio "overlapping" the wrong video/audio. A
            # SCREEN_SHARE_AUDIO track is never watched on its own - it only
            # ever means anything alongside its matching SCREEN_SHARE video
            # - so instead of measuring its own drift, it inherits the
            # offset and stretch factor of whichever SCREEN_SHARE video
            # track's own wall-clock [start,end] overlaps it most (falling
            # back to nearest-start if none technically overlap, e.g. one
            # LiveKit job ended a fraction of a second before the other
            # began). That keeps the two glued together for the audio's
            # entire real duration, exactly like a real editor would.
            for i in "${!C_LOCAL_FILES[@]}"; do
              [[ "${C_TYPES[$i]}" == "AUDIO" && "${C_SOURCES[$i]}" == "SCREEN_SHARE_AUDIO" ]] || continue
              best_j=-1
              best_overlap=""
              for j in "${!C_LOCAL_FILES[@]}"; do
                [[ "${C_TYPES[$j]}" == "VIDEO" && "${C_SOURCES[$j]}" == "SCREEN_SHARE" ]] || continue
                [[ "${C_STARTS[$i]}" == "0" || "${C_STARTS[$j]}" == "0" ]] && continue
                overlap=$(echo "$(echo "${C_ENDS[$i]} < ${C_ENDS[$j]}" | bc -l | grep -q 1 && echo "${C_ENDS[$i]}" || echo "${C_ENDS[$j]}") - $(echo "${C_STARTS[$i]} > ${C_STARTS[$j]}" | bc -l | grep -q 1 && echo "${C_STARTS[$i]}" || echo "${C_STARTS[$j]}")" | bc)
                if [[ -z "$best_overlap" ]] || (( $(echo "$overlap > $best_overlap" | bc -l) )); then
                  best_overlap="$overlap"
                  best_j="$j"
                fi
              done
              if [[ "$best_j" != "-1" ]]; then
                old_offset="${OFFSETS[$i]}"
                OFFSETS[$i]="${OFFSETS[$best_j]}"
                STRETCH[$i]="${STRETCH[$best_j]}"
                # Copy the video's own (already speed-trusted, capped)
                # rendered length directly rather than recomputing one from
                # this audio track's own raw duration, so the two share
                # not just the same start but the exact same window.
                STRETCHED_DURATIONS[$i]="${STRETCHED_DURATIONS[$best_j]}"
                new_end=$(echo "${OFFSETS[$i]} + ${STRETCHED_DURATIONS[$i]}" | bc)
                if (( $(echo "$new_end > $TOTAL_DURATION" | bc -l) )); then
                  TOTAL_DURATION=$(echo "($new_end + 2) / 1" | bc)
                fi
                log "session $cluster_num track[$i] source=SCREEN_SHARE_AUDIO: locked to track[$best_j]'s timeline (offset ${old_offset}s->${OFFSETS[$i]}s) - shares its video's exact window and native speed, instead of its own independently-measured gap"
              fi
            done

            # Pre-pass: collect every SCREEN_SHARE/WHITEBOARD ("full-frame")
            # video track's own active window (using its STRETCHED duration,
            # since that's how long it actually plays in the composite), so
            # any OTHER video track (in practice: camera) can tell, at any
            # moment t, whether something else already legitimately owns
            # the full frame. FS_SUM_EXPR evaluates to >0 at any instant
            # when at least one full-frame source is active, 0 otherwise (0
            # permanently if there are no full-frame sources in this
            # session).
            FS_TERMS=()
            for i in "${!C_LOCAL_FILES[@]}"; do
              if [[ "${C_TYPES[$i]}" == "VIDEO" && ( "${C_SOURCES[$i]}" == "SCREEN_SHARE" || "${C_SOURCES[$i]}" == "WHITEBOARD" ) ]]; then
                fs_offset="${OFFSETS[$i]}"
                fs_end=$(echo "${OFFSETS[$i]} + ${STRETCHED_DURATIONS[$i]}" | bc)
                FS_TERMS+=("between(t,${fs_offset},${fs_end})")
              fi
            done
            if [[ "${#FS_TERMS[@]}" -eq 0 ]]; then
              FS_SUM_EXPR="0"
            else
              FS_SUM_EXPR=$(IFS='+'; echo "${FS_TERMS[*]}")
            fi
            log "session $cluster_num full-frame-active expression: $FS_SUM_EXPR"

            # ---- Hold the last frame of a full-frame source through any
            # gap that follows it, instead of cutting to the bare navy
            # background ----
            #
            # Whenever a screen share/whiteboard ended (or was paused and
            # re-shared later, producing a separate egress track with a gap
            # in between) and nothing else was active yet, the composite
            # used to fall straight through to the plain color background -
            # sometimes for tens of seconds at a time, audio still playing
            # underneath - which reads as broken/glitchy rather than a
            # deliberate blank moment (this is what was reported as "screen
            # sharing isn't looking fine"). A real recording studio would
            # hold the last slide/frame on a frozen "slate" until the next
            # thing begins instead of cutting to black, so that's what this
            # does: each full-frame source's hold window runs from its own
            # end until the NEXT full-frame source begins (or the end of
            # the session, if it's the last one) - but a genuine live
            # camera instant (per CAMERA_VISIBLE_SUM_EXPR) always wins over
            # a frozen slate, so the hold is gated to only show while no
            # camera is visible either. This deliberately does NOT apply to
            # camera tracks themselves - holding a frozen camera frame
            # during a real camera gap is exactly the earlier "static photo
            # sitting in the corner/full frame" bug the freeze-detection
            # logic above exists to eliminate, so a camera gap still
            # correctly shows nothing rather than a stale face.
            declare -A HOLD_END HOLD_DUR
            declare -a FS_IDX_SORTED=()
            for i in "${!C_LOCAL_FILES[@]}"; do
              [[ "${C_TYPES[$i]}" == "VIDEO" && ( "${C_SOURCES[$i]}" == "SCREEN_SHARE" || "${C_SOURCES[$i]}" == "WHITEBOARD" ) ]] || continue
              FS_IDX_SORTED+=("$i")
            done
            # Insertion sort by OFFSETS - the number of full-frame tracks in
            # one session is always tiny, so simplicity wins over speed.
            for ((a=1; a<${#FS_IDX_SORTED[@]}; a++)); do
              key="${FS_IDX_SORTED[$a]}"
              key_off="${OFFSETS[$key]}"
              b=$((a-1))
              while [[ $b -ge 0 ]] && (( $(echo "${OFFSETS[${FS_IDX_SORTED[$b]}]} > $key_off" | bc -l) )); do
                FS_IDX_SORTED[$((b+1))]="${FS_IDX_SORTED[$b]}"
                b=$((b-1))
              done
              FS_IDX_SORTED[$((b+1))]="$key"
            done
            for idx in "${!FS_IDX_SORTED[@]}"; do
              i="${FS_IDX_SORTED[$idx]}"
              own_end=$(echo "${OFFSETS[$i]} + ${STRETCHED_DURATIONS[$i]}" | bc)
              next_pos=$((idx+1))
              if [[ "$next_pos" -lt "${#FS_IDX_SORTED[@]}" ]]; then
                next_i="${FS_IDX_SORTED[$next_pos]}"
                hold_end="${OFFSETS[$next_i]}"
              else
                hold_end="$TOTAL_DURATION"
              fi
              (( $(echo "$hold_end < $own_end" | bc -l) )) && hold_end="$own_end"
              hold_dur=$(echo "$hold_end - $own_end" | bc)
              (( $(echo "$hold_dur < 0" | bc -l) )) && hold_dur=0
              HOLD_END[$i]="$hold_end"
              HOLD_DUR[$i]="$hold_dur"
            done

            FFMPEG_INPUTS+=(-f lavfi -i "color=c=0x0e1c76:s=1280x720:r=30:d=${TOTAL_DURATION}")
            CUR_LABEL="0:v"

            # Pass 1: register each video track's ffmpeg input and its
            # scale/split filter stage(s) only - no compositing (overlay)
            # yet. Compositing order matters and is handled separately in
            # pass 2 below, because a full-frame source (screen
            # share/whiteboard) is fully opaque: if a camera's small corner
            # TILE were drawn onto the canvas *before* the full-frame
            # source, the full-frame layer drawn on top afterwards would
            # completely paint over it and the tile would never actually be
            # visible - exactly the bug found by inspecting a real
            # composite frame during a screen-share window and finding no
            # camera tile there at all, even though the tile's own
            # enable/timing logic looked correct on paper.
            # A screen share/whiteboard used to be scaled to the FULL
            # 1280x720 canvas, with camera tiles overlaid in a bottom-right
            # corner on top of it - which meant the tiles could sit right on
            # top of real content (e.g. the bottom of a shared PDF/slide),
            # visually interrupting the share. Whenever a full-frame source
            # is active AND a camera is genuinely visible at that same
            # instant, it's now confined to a fixed CONTENT BOX on the left
            # (960px wide, full height) and the camera renders as a small
            # tile in a dedicated COLUMN on the right (the remaining 320px)
            # instead - the two regions never overlap, so a camera tile can
            # never cover any part of the shared content.
            #
            # That column is only worth reserving if a camera could
            # actually appear in it right now - see CAMERA_VISIBLE_SUM_EXPR
            # further below for the full reasoning and how that's decided.
            # The column is only ever drawn into when a camera tile is
            # actually being placed there (the "else" branch of the Pass 1
            # loop below), which only happens for a genuine camera-like
            # track - so these themselves can just be fixed constants.
            TILE_COL_X=960
            TILE_COL_W=$((1280 - TILE_COL_X))

            # ---- Detect within-track freezes on camera-like tracks ----
            #
            # A track's [offset, offset+duration] window was always treated
            # as continuously live for its whole span. That's wrong when a
            # participant disables their camera without LiveKit actually
            # ending the egress track: the recording just keeps going with
            # whatever the last real frame was repeated for however long
            # the camera stays off (confirmed independently by ffmpeg's own
            # "More than N frames duplicated" warning seen in practice when
            # normalizing such a file to constant fps), and the composite
            # then shows that stale frame as if it were live video - a
            # static "photo" sitting in the corner tile or full-frame view
            # for however long the freeze lasts, not a blank/no-camera
            # state. This detection is deliberately ONLY applied to
            # camera-like tracks, never to SCREEN_SHARE/WHITEBOARD ones: a
            # presenter not actively drawing or scrolling for a while is
            # normal, expected stillness, not a bug, and hiding a merely-
            # quiet screen share would itself be wrong.
            #
            # ACTIVE_EXPR[i] holds the ffmpeg boolean expression (in terms
            # of `t`, the global composite timeline) for when this track
            # should actually be shown. It defaults to the original plain
            # between(offset,end) whenever no freeze is found, so a track
            # with no freeze behaves exactly as before this change.
            FREEZE_MIN_SECONDS=3
            # Below MIN_LAYOUT_GAP_SECONDS, a gap between two surviving
            # (non-frozen) windows of the SAME camera-like track is bridged
            # over for LAYOUT purposes only (see LAYOUT_EXPR below) - it
            # does not change when the camera's own picture is shown.
            MIN_LAYOUT_GAP_SECONDS=6
            declare -a ACTIVE_EXPR=() LAYOUT_EXPR=()
            for i in "${!C_LOCAL_FILES[@]}"; do
              [[ "${C_TYPES[$i]}" == "VIDEO" ]] || continue
              [[ "${C_SOURCES[$i]}" == "SCREEN_SHARE" || "${C_SOURCES[$i]}" == "WHITEBOARD" ]] && continue

              f="${C_LOCAL_FILES[$i]}"
              offset="${OFFSETS[$i]}"
              stretch="${STRETCH[$i]}"
              dur="${DURATIONS[$i]}"
              default_end=$(echo "$offset + ${STRETCHED_DURATIONS[$i]}" | bc)
              ACTIVE_EXPR[$i]="between(t,${offset},${default_end})"
              LAYOUT_EXPR[$i]="${ACTIVE_EXPR[$i]}"

              if [[ -z "$dur" ]] || (( $(echo "$dur <= 0" | bc -l) )); then
                continue
              fi

              FREEZE_LOG="${WORKDIR}/freezedetect_${cluster_num}_${i}.log"
              ffmpeg -hide_banner -nostats -nostdin -i "$f" \
                -vf "freezedetect=n=-60dB:d=${FREEZE_MIN_SECONDS}" -an -f null - \
                > "$FREEZE_LOG" 2>&1 </dev/null || true

              declare -a FREEZE_STARTS=() FREEZE_ENDS=()
              while IFS= read -r fzline; do
                if [[ "$fzline" =~ freeze_start:\ ([0-9.]+) ]]; then
                  FREEZE_STARTS+=("${BASH_REMATCH[1]}")
                elif [[ "$fzline" =~ freeze_end:\ ([0-9.]+) ]]; then
                  FREEZE_ENDS+=("${BASH_REMATCH[1]}")
                fi
              done < "$FREEZE_LOG"

              if [[ "${#FREEZE_STARTS[@]}" -eq 0 ]]; then
                unset FREEZE_STARTS FREEZE_ENDS
                continue
              fi

              # A freeze still ongoing when the file ends emits a
              # freeze_start with no matching freeze_end - treat that as
              # frozen through the end of the track's own duration.
              while [[ "${#FREEZE_ENDS[@]}" -lt "${#FREEZE_STARTS[@]}" ]]; do
                FREEZE_ENDS+=("$dur")
              done

              log "session $cluster_num track[$i] source=${C_SOURCES[$i]}: ${#FREEZE_STARTS[@]} freeze period(s) detected (>=${FREEZE_MIN_SECONDS}s each) - will be hidden instead of shown as a static frame"

              # Walk local (pre-stretch) track time from 0 to dur, cut out
              # each detected [freeze_start,freeze_end) window, and convert
              # each surviving live sub-range into global composite-
              # timeline time the same way the rest of this script already
              # does for the track as a whole (multiply by its own drift-
              # correction stretch factor, then add its offset).
              declare -a TERMS=() G_STARTS=() G_ENDS=()
              cursor="0"
              for fi in "${!FREEZE_STARTS[@]}"; do
                fs="${FREEZE_STARTS[$fi]}"
                fe="${FREEZE_ENDS[$fi]}"
                if (( $(echo "$fs > $cursor" | bc -l) )); then
                  g_start=$(echo "$cursor * $stretch + $offset" | bc)
                  g_end=$(echo "$fs * $stretch + $offset" | bc)
                  TERMS+=("between(t,${g_start},${g_end})")
                  G_STARTS+=("$g_start")
                  G_ENDS+=("$g_end")
                fi
                cursor="$fe"
              done
              if (( $(echo "$cursor < $dur" | bc -l) )); then
                g_start=$(echo "$cursor * $stretch + $offset" | bc)
                g_end=$(echo "$dur * $stretch + $offset" | bc)
                TERMS+=("between(t,${g_start},${g_end})")
                G_STARTS+=("$g_start")
                G_ENDS+=("$g_end")
              fi

              if [[ "${#TERMS[@]}" -eq 0 ]]; then
                # Frozen for its entire duration - never actually active.
                ACTIVE_EXPR[$i]="0"
                LAYOUT_EXPR[$i]="0"
              else
                active_sum=$(IFS='+'; echo "${TERMS[*]}")
                ACTIVE_EXPR[$i]="gt(${active_sum},0)"

                # ---- Bridge short gaps for the LAYOUT decision only ----
                #
                # A presenter's camera can freeze and unfreeze more than
                # once in quick succession (a flaky connection stuttering
                # a few seconds at a time). Each of those freezes is
                # correctly hidden above (ACTIVE_EXPR), but if the
                # whiteboard/screen-share layout below reacts to every one
                # of them individually, a handful of few-second freezes
                # packed into under 20 real seconds makes the full-frame
                # content repeatedly resize between narrow and wide (and
                # the camera tile + its reserved column pop in and out)
                # several times in a row - confirmed against a real
                # session where two ~4s camera freezes 4-5s apart made the
                # whiteboard flip narrow/wide/narrow/wide four times in
                # about 12 seconds, reported as the screen-share and
                # camera picture looking "distorted". Any gap shorter than
                # MIN_LAYOUT_GAP_SECONDS between two surviving windows of
                # THIS track is therefore bridged into one continuous
                # window here, so a brief blip no longer flips the layout
                # - the camera's own picture still correctly disappears
                # for the real freeze either way, via ACTIVE_EXPR above,
                # which this bridging never touches.
                declare -a LAYOUT_STARTS=() LAYOUT_ENDS=()
                for gi in "${!G_STARTS[@]}"; do
                  gs="${G_STARTS[$gi]}"
                  ge="${G_ENDS[$gi]}"
                  if [[ "${#LAYOUT_STARTS[@]}" -gt 0 ]]; then
                    last_idx=$(( ${#LAYOUT_ENDS[@]} - 1 ))
                    gap=$(echo "$gs - ${LAYOUT_ENDS[$last_idx]}" | bc)
                    if (( $(echo "$gap < $MIN_LAYOUT_GAP_SECONDS" | bc -l) )); then
                      LAYOUT_ENDS[$last_idx]="$ge"
                      continue
                    fi
                  fi
                  LAYOUT_STARTS+=("$gs")
                  LAYOUT_ENDS+=("$ge")
                done
                declare -a LAYOUT_TERMS=()
                for gi in "${!LAYOUT_STARTS[@]}"; do
                  LAYOUT_TERMS+=("between(t,${LAYOUT_STARTS[$gi]},${LAYOUT_ENDS[$gi]})")
                done
                layout_sum=$(IFS='+'; echo "${LAYOUT_TERMS[*]}")
                LAYOUT_EXPR[$i]="gt(${layout_sum},0)"
                unset LAYOUT_STARTS LAYOUT_ENDS LAYOUT_TERMS
              fi

              unset FREEZE_STARTS FREEZE_ENDS TERMS G_STARTS G_ENDS
            done

            # Whenever no camera is genuinely visible right now - because
            # this session never had one, the presenter has it switched
            # off at this instant, or it's currently in a detected freeze -
            # there's no camera column to keep clear, so a whiteboard/
            # screen-share should use the entire 1280x720 canvas instead of
            # being confined to the narrower 960 content box. This is a
            # deliberate change from treating that as a one-time
            # per-session decision: reserving the column for an entire
            # session just because a camera was on for a moment (or is
            # frozen and effectively invisible) left a permanent, unused
            # navy strip next to full-width content the rest of the time -
            # exactly what was reported. The trade-off is that the layout
            # can now visibly resize whenever the presenter's camera
            # actually toggles, which is judged the lesser issue versus
            # wasting a quarter of the frame on an empty column.
            declare -a CAMERA_VISIBLE_TERMS=()
            for i in "${!C_LOCAL_FILES[@]}"; do
              [[ "${C_TYPES[$i]}" == "VIDEO" ]] || continue
              [[ "${C_SOURCES[$i]}" == "SCREEN_SHARE" || "${C_SOURCES[$i]}" == "WHITEBOARD" ]] && continue
              CAMERA_VISIBLE_TERMS+=("${LAYOUT_EXPR[$i]}")
            done
            if [[ "${#CAMERA_VISIBLE_TERMS[@]}" -eq 0 ]]; then
              CAMERA_VISIBLE_SUM_EXPR="0"
            else
              CAMERA_VISIBLE_SUM_EXPR=$(IFS='+'; echo "${CAMERA_VISIBLE_TERMS[*]}")
            fi
            log "session $cluster_num camera-visible-now expression: $CAMERA_VISIBLE_SUM_EXPR"

            unset VLABEL_FULL VLABEL_TILE VLABEL_NARROW VLABEL_WIDE VLABEL_HOLD IS_FS_SOURCE TILE_X TILE_Y
            declare -A VLABEL_FULL VLABEL_TILE VLABEL_NARROW VLABEL_WIDE VLABEL_HOLD IS_FS_SOURCE TILE_X TILE_Y
            TILE_COUNTER=0
            for i in "${!C_LOCAL_FILES[@]}"; do
              type_v="${C_TYPES[$i]}"
              source_v="${C_SOURCES[$i]}"
              [[ "$type_v" == "VIDEO" ]] || continue

              offset="${OFFSETS[$i]}"
              stretch="${STRETCH[$i]}"
              FFMPEG_INPUTS+=(-itsoffset "$offset" -i "${C_LOCAL_FILES[$i]}")

              if [[ "$source_v" == "SCREEN_SHARE" || "$source_v" == "WHITEBOARD" ]]; then
                # Two differently-scaled copies of the same source, same
                # technique as the camera full/tile split below: a narrow
                # one (960x720) for instants when a camera is genuinely
                # visible and needs its column left clear, and a wide one
                # (1280x720, the full canvas) for instants when it isn't.
                # Pass 2 below picks whichever one actually applies at each
                # moment via CAMERA_VISIBLE_SUM_EXPR - this only prepares
                # both; it doesn't decide between them.
                FILTER_PARTS+=("[${INPUT_IDX}:v]split=3[fs${INPUT_IDX}narrow][fs${INPUT_IDX}wide][fs${INPUT_IDX}hold]")
                FILTER_PARTS+=("[fs${INPUT_IDX}narrow]scale=${TILE_COL_X}:720:force_original_aspect_ratio=decrease,pad=${TILE_COL_X}:720:(ow-iw)/2:(oh-ih)/2,setpts=(PTS-STARTPTS)*${stretch}+${offset}/TB[v${INPUT_IDX}n]")
                FILTER_PARTS+=("[fs${INPUT_IDX}wide]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setpts=(PTS-STARTPTS)*${stretch}+${offset}/TB[v${INPUT_IDX}w]")
                # A third copy, held on its own last frame for the gap that
                # follows this source (see HOLD_DUR pre-pass above) instead
                # of letting the composite fall through to blank navy.
                # tpad's stop_duration is measured on THIS stream's own
                # pre-setpts timeline, but setpts below multiplies every PTS
                # (including the padded tail) by $stretch - so the padding
                # has to be pre-divided by $stretch here for the tail to
                # actually last HOLD_DUR seconds once setpts has run.
                hold_dur_raw="${HOLD_DUR[$i]:-0}"
                hold_pad=$(echo "scale=6; $hold_dur_raw / $stretch" | bc)
                (( $(echo "$hold_pad < 0" | bc -l) )) && hold_pad=0
                # tpad's stop_duration is a duration-typed ffmpeg option -
                # see fix_duration_leading_zero above.
                hold_pad=$(fix_duration_leading_zero "$hold_pad")
                FILTER_PARTS+=("[fs${INPUT_IDX}hold]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,tpad=stop_mode=clone:stop_duration=${hold_pad},setpts=(PTS-STARTPTS)*${stretch}+${offset}/TB[v${INPUT_IDX}h]")
                VLABEL_NARROW[$i]="v${INPUT_IDX}n"
                VLABEL_WIDE[$i]="v${INPUT_IDX}w"
                VLABEL_HOLD[$i]="v${INPUT_IDX}h"
                IS_FS_SOURCE[$i]=1
              else
                # Not a designated full-frame source (camera, or anything
                # else that lands here): goes full-frame whenever it's
                # active and nothing else is claiming the full frame at
                # that moment, and shrinks to a small tile in the right-hand
                # column only during the sub-window(s) where it overlaps a
                # genuine full-frame source (screen share / whiteboard).
                # ffmpeg can't resize one overlay dynamically, so this needs
                # two differently-scaled copies of the same input, each
                # gated by the opposite half of that condition. Tiles stack
                # top-to-bottom (not left-to-right) so they stay inside the
                # dedicated column and never drift left into the content
                # box. tile_row comes from a dedicated counter over
                # camera-like tracks only - not the raw track index i, which
                # mixes in audio tracks and would scatter/mis-position tiles
                # as soon as track ordering shifted (e.g. an extra mic track
                # before a camera). Capped at 4 stacked tiles (fits exactly
                # within 720px tall at this tile_h/margin); a 5th
                # simultaneous camera would wrap and overlap a lower tile -
                # no room realistically expected here has more than 4
                # cameras on at once.
                tile_margin=8
                tile_h=$(( (720 - 5 * tile_margin) / 4 ))
                tile_w=$(( TILE_COL_W - 10 ))
                tile_row=$(( TILE_COUNTER % 4 ))
                TILE_COUNTER=$((TILE_COUNTER + 1))
                VLABEL_FULL[$i]="v${INPUT_IDX}f"
                VLABEL_TILE[$i]="v${INPUT_IDX}t"
                TILE_X[$i]="${TILE_COL_X}+5"
                TILE_Y[$i]="${tile_margin}+((${tile_row})*(${tile_h}+${tile_margin}))"
                IS_FS_SOURCE[$i]=0
                FILTER_PARTS+=("[${INPUT_IDX}:v]split=2[cam${INPUT_IDX}tile][cam${INPUT_IDX}full]")
                FILTER_PARTS+=("[cam${INPUT_IDX}tile]scale=${tile_w}:${tile_h}:force_original_aspect_ratio=decrease,setpts=(PTS-STARTPTS)*${stretch}+${offset}/TB[v${INPUT_IDX}t]")
                FILTER_PARTS+=("[cam${INPUT_IDX}full]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setpts=(PTS-STARTPTS)*${stretch}+${offset}/TB[v${INPUT_IDX}f]")
              fi
              INPUT_IDX=$((INPUT_IDX + 1))
            done

            # Pass 2: composite in the order that actually keeps things
            # visible - the frozen full-frame HOLD tails first (lowest
            # layer of all: pure fallback for when nothing else has
            # anything to show), then camera full-frame views (mutually
            # exclusive in time with the full-frame sources below by
            # construction, so draw order between them never matters, and
            # gated to skip whenever a hold is also eligible so a live
            # camera always wins over a frozen slate), then the full-frame
            # sources themselves, then camera corner TILES last/on top so
            # they're never painted over.
            for i in "${!C_LOCAL_FILES[@]}"; do
              [[ "${C_TYPES[$i]}" == "VIDEO" && "${IS_FS_SOURCE[$i]:-}" == "1" ]] || continue
              hold_dur="${HOLD_DUR[$i]:-0}"
              (( $(echo "$hold_dur <= 0" | bc -l) )) && continue
              hold_start=$(echo "${OFFSETS[$i]} + ${STRETCHED_DURATIONS[$i]}" | bc)
              hold_end="${HOLD_END[$i]:-$hold_start}"
              FILTER_PARTS+=("[${CUR_LABEL}][${VLABEL_HOLD[$i]}]overlay=enable='between(t,${hold_start},${hold_end})*lte(${CAMERA_VISIBLE_SUM_EXPR},0)'[ovh${i}]")
              CUR_LABEL="ovh${i}"
            done
            for i in "${!C_LOCAL_FILES[@]}"; do
              [[ "${C_TYPES[$i]}" == "VIDEO" && "${IS_FS_SOURCE[$i]:-}" == "0" ]] || continue
              FILTER_PARTS+=("[${CUR_LABEL}][${VLABEL_FULL[$i]}]overlay=enable='${ACTIVE_EXPR[$i]}*lte(${FS_SUM_EXPR},0)'[ovf${i}]")
              CUR_LABEL="ovf${i}"
            done
            for i in "${!C_LOCAL_FILES[@]}"; do
              [[ "${C_TYPES[$i]}" == "VIDEO" && "${IS_FS_SOURCE[$i]:-}" == "1" ]] || continue
              offset="${OFFSETS[$i]}"
              end=$(echo "$offset + ${STRETCHED_DURATIONS[$i]}" | bc)
              # Mutually exclusive by construction (gt/lte on the same
              # expression), so draw order between narrow and wide never
              # matters - and neither can ever coincide with this track's
              # own camera tile below, since any camera tile being active
              # necessarily makes CAMERA_VISIBLE_SUM_EXPR > 0 too.
              FILTER_PARTS+=("[${CUR_LABEL}][${VLABEL_NARROW[$i]}]overlay=enable='between(t,${offset},${end})*gt(${CAMERA_VISIBLE_SUM_EXPR},0)'[ovsn${i}]")
              CUR_LABEL="ovsn${i}"
              FILTER_PARTS+=("[${CUR_LABEL}][${VLABEL_WIDE[$i]}]overlay=enable='between(t,${offset},${end})*lte(${CAMERA_VISIBLE_SUM_EXPR},0)'[ovsw${i}]")
              CUR_LABEL="ovsw${i}"
            done
            for i in "${!C_LOCAL_FILES[@]}"; do
              [[ "${C_TYPES[$i]}" == "VIDEO" && "${IS_FS_SOURCE[$i]:-}" == "0" ]] || continue
              FILTER_PARTS+=("[${CUR_LABEL}][${VLABEL_TILE[$i]}]overlay=x='${TILE_X[$i]}':y='${TILE_Y[$i]}':enable='${ACTIVE_EXPR[$i]}*gt(${FS_SUM_EXPR},0)'[ovt${i}]")
              CUR_LABEL="ovt${i}"
            done
            FINAL_VIDEO_LABEL="$CUR_LABEL"

            AUDIO_INPUT_LABELS=()
            for i in "${!C_LOCAL_FILES[@]}"; do
              if [[ "${C_TYPES[$i]}" == "AUDIO" ]]; then
                FFMPEG_INPUTS+=(-itsoffset "${OFFSETS[$i]}" -i "${C_LOCAL_FILES[$i]}")
                stretch="${STRETCH[$i]}"

                # ---- Per-track cleanup/leveling, before mixing ----
                #
                # A raw MICROPHONE capture picks up whatever's in the room
                # continuously - fan/AC hum, hiss, echo - at a level that,
                # measured directly against a real SCREEN_SHARE_AUDIO track
                # from this pipeline, came out roughly 17dB louder on
                # average than the shared audio (a loopback capture of
                # whatever the presenter is playing back, typically
                # captured much quieter). ffmpeg's amix below combines
                # tracks at their ORIGINAL relative volumes - it has no
                # concept of "wanted content" vs "background noise", so
                # that ~17dB gap survives straight into the mix and buries
                # the screen audio under the mic's noise floor for the
                # whole time both are present, exactly as reported ("shared
                # audio gets suppressed completely by the background noise
                # of mic"). Two complementary, deterministic fixes, applied
                # per track before mixing:
                #  - the mic specifically gets a high-pass (cuts AC hum/
                #    rumble below speech's own range) and an FFT noise
                #    reducer (afftdn - suppresses a continuous, stable
                #    noise floor like fan/hiss without touching transient
                #    speech), so there's less background noise left to
                #    compete with the screen audio in the first place.
                #  - EVERY audio track (mic included) is then measured
                #    (mean_volume, via a throwaway ffmpeg pass through the
                #    SAME cleanup filter used above so the measurement
                #    matches what actually reaches the mix) and given a
                #    fixed, static dB gain to bring it to a common target
                #    loudness before mixing - not ffmpeg's loudnorm, which
                #    turned out to apply a time-varying gain that can pump
                #    residual noise back up unpredictably (verified: it
                #    measurably made a synthetic version of this exact mic/
                #    screen mismatch WORSE in testing); a single measured,
                #    clamped, static gain per track is fully predictable
                #    and directly closes the measured gap instead. A track
                #    that's essentially silent to begin with is left alone
                #    (no gain is worth applying to a near-empty track, and
                #    boosting it would just make its own noise floor
                #    louder for no benefit), and the gain is clamped either
                #    way so a bad measurement can never produce an extreme
                #    swing. alimiter is a cheap safety net against the rare
                #    case a boosted track's true peaks (as opposed to its
                #    average level, which is all a single gain is based on)
                #    come close to clipping.
                TARGET_AUDIO_MEAN_DB=-20
                MIN_MEASURABLE_MEAN_DB=-70
                MAX_AUDIO_GAIN_DB=24
                MIN_AUDIO_GAIN_DB=-12
                if [[ "${C_SOURCES[$i]}" == "MICROPHONE" ]]; then
                  audio_pre_filter="highpass=f=80,afftdn=nr=30:nf=-30"
                else
                  audio_pre_filter=""
                fi
                measured_mean_db=$(ffmpeg -hide_banner -nostdin -i "${C_LOCAL_FILES[$i]}" \
                  -af "${audio_pre_filter:+${audio_pre_filter},}volumedetect" -f null - 2>&1 \
                  | grep -oP 'mean_volume:\s*\K[-0-9.]+' | tail -1 || true)
                if [[ -z "$measured_mean_db" ]]; then
                  audio_gain_db="0"
                elif (( $(echo "$measured_mean_db <= $MIN_MEASURABLE_MEAN_DB" | bc -l) )); then
                  audio_gain_db="0"
                else
                  audio_gain_db=$(echo "scale=3; $TARGET_AUDIO_MEAN_DB - ($measured_mean_db)" | bc)
                  (( $(echo "$audio_gain_db > $MAX_AUDIO_GAIN_DB" | bc -l) )) && audio_gain_db="$MAX_AUDIO_GAIN_DB"
                  (( $(echo "$audio_gain_db < $MIN_AUDIO_GAIN_DB" | bc -l) )) && audio_gain_db="$MIN_AUDIO_GAIN_DB"
                fi
                log "session $cluster_num track[$i] source=${C_SOURCES[$i]} audio: measured_mean=${measured_mean_db:-n/a}dB applying gain=${audio_gain_db}dB"
                audio_clean_chain="${audio_pre_filter:+${audio_pre_filter},}volume=${audio_gain_db}dB,alimiter=limit=0.97,"

                # Same drift correction as video, applied to audio: atempo
                # changes playback speed (and therefore duration) instead
                # of ffmpeg's scale/setpts, so a track whose probed
                # duration ran short of its real wall-clock span gets
                # slowed down by 1/stretch to fill that span instead of
                # ending early and drifting out of sync with everything
                # else.
                needs_correction=1
                (( $(echo "${stretch#-} > 0.99" | bc -l) )) && (( $(echo "${stretch#-} < 1.01" | bc -l) )) && needs_correction=0

                # ---- Actually delay this track within the mix ----
                #
                # Every earlier revision positioned an audio track by
                # relabeling its timestamps (asetpts=PTS-STARTPTS+offset/TB)
                # and relying on amix to place it in time accordingly. It
                # doesn't: amix mixes each input purely by sample position -
                # it starts summing from the first sample each input filter
                # chain produces, with no regard for PTS at all. Retagging a
                # stream's PTS as "starts at 104.964s" doesn't move a single
                # sample of actual audio later - the real content still
                # begins at the mix's sample 0, exactly as if offset had
                # been 0. That's a different, more severe bug than the
                # SCREEN_SHARE_AUDIO drift this pipeline already corrects
                # for: instead of drifting a few seconds from its own video
                # over time, the shared audio's entire ~47s of real content
                # played from the very start of the recording, mixed on top
                # of whatever else (mic, an earlier share) was already
                # sounding at that time - exactly as reported ("audio is
                # being played at the start and being mixed with earlier
                # audio though it was played near the end"). Confirmed with
                # a real ffmpeg run: an asetpts-delayed 1500Hz tone showed up
                # at full strength at t=0 in the mixed output, not at its
                # intended offset. The fix is `adelay`, which - unlike
                # asetpts - inserts actual silent samples ahead of the real
                # audio, so amix has real silence to sum against until the
                # track's true content arrives. adelay's delay has to be in
                # (integer) milliseconds and is measured on THIS stream's
                # own timeline, so it goes after the atempo speed correction
                # (which alters how long the real content itself takes) and
                # uses the plain, unstretched offset - the same split
                # video's setpts already keeps between "stretch the content"
                # and "then place it after this fixed, real-time gap".
                # `:all=1` applies the same delay to every channel
                # regardless of whether this track is mono or stereo,
                # instead of requiring one delay value per channel.
                offset_ms=$(printf '%.0f' "$(echo "${OFFSETS[$i]} * 1000" | bc -l)")
                (( offset_ms < 0 )) && offset_ms=0
                if [[ "$needs_correction" -eq 1 ]]; then
                  atempo_target=$(echo "scale=6; 1 / $stretch" | bc)
                  atempo_chain=$(build_atempo_chain "$atempo_target")
                  FILTER_PARTS+=("[${INPUT_IDX}:a]${audio_clean_chain}${atempo_chain},adelay=${offset_ms}:all=1[a${INPUT_IDX}p]")
                else
                  FILTER_PARTS+=("[${INPUT_IDX}:a]${audio_clean_chain}adelay=${offset_ms}:all=1[a${INPUT_IDX}p]")
                fi
                AUDIO_INPUT_LABELS+=("a${INPUT_IDX}p")
                INPUT_IDX=$((INPUT_IDX + 1))
              fi
            done

            if [[ "${#AUDIO_INPUT_LABELS[@]}" -eq 0 ]]; then
              FFMPEG_INPUTS+=(-f lavfi -i "anullsrc=r=48000:cl=stereo:d=${TOTAL_DURATION}")
              AUDIO_INPUT_LABELS+=("${INPUT_IDX}:a")
              INPUT_IDX=$((INPUT_IDX + 1))
              FINAL_AUDIO_LABEL="${AUDIO_INPUT_LABELS[0]}"
            elif [[ "${#AUDIO_INPUT_LABELS[@]}" -eq 1 ]]; then
              FINAL_AUDIO_LABEL="${AUDIO_INPUT_LABELS[0]}"
            else
              mix_inputs=""
              for lbl in "${AUDIO_INPUT_LABELS[@]}"; do mix_inputs+="[${lbl}]"; done
              # normalize=0: each track was already brought to a consistent
              # target loudness above, so amix's own default behavior of
              # additionally dividing the mix by the input count is no
              # longer needed to avoid clipping here (loudnorm's own true
              # peak ceiling already does that) and would only make the
              # whole mix quieter without changing the mic/screen balance
              # that was actually the problem.
              FILTER_PARTS+=("${mix_inputs}amix=inputs=${#AUDIO_INPUT_LABELS[@]}:duration=longest:dropout_transition=0:normalize=0[outa]")
              FINAL_AUDIO_LABEL="outa"
            fi

            # Safety net, independent of *why* an audio stream might come up
            # short (a drift-correction miscalculation, a source file with
            # imprecise internal duration metadata, or anything else not
            # yet seen): pad the final audio with silence out to the full
            # composed duration, so a short audio stream can never leave
            # the tail of a recording with picture but no sound. The final
            # -t below still trims anything too long, so this only ever
            # adds silence, never cuts real audio short. This also gives
            # every path (0, 1, or 2+ audio tracks) the same filter-graph
            # output label, so mapping it is always just "[finalaudio]" -
            # no more bare-stream-ref-vs-label branching needed for -map.
            FILTER_PARTS+=("[${FINAL_AUDIO_LABEL}]apad=whole_dur=${TOTAL_DURATION}[finalaudio]")
            AUDIO_MAP_ARG="[finalaudio]"

            FILTER_COMPLEX=$(IFS=';'; echo "${FILTER_PARTS[*]}")

            if [[ "$CLUSTER_COUNT" -gt 1 ]]; then
              FILE_NAME="${ROOM_ID}__session${cluster_num}.mp4"
            else
              FILE_NAME="${ROOM_ID}.mp4"
            fi
            OUT_MP4="${WORKDIR}/${FILE_NAME}"
            log "session $cluster_num: running ffmpeg..."
            log "session $cluster_num filter_complex: $FILTER_COMPLEX"

            # FILTER_COMPLEX always has at least the apad stage above now
            # (it is never empty), so there's always a real filter graph to
            # run - no more empty-filter fallback path needed.
            ffmpeg -y -hide_banner -loglevel warning -nostdin \
              "${FFMPEG_INPUTS[@]}" \
              -filter_complex "$FILTER_COMPLEX" \
              -map "[${FINAL_VIDEO_LABEL}]" -map "$AUDIO_MAP_ARG" \
              -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p \
              -c:a aac -b:a 160k \
              -t "$TOTAL_DURATION" -movflags +faststart \
              "$OUT_MP4" </dev/null

            FFMPEG_STATUS=$?
            if [[ $FFMPEG_STATUS -ne 0 || ! -s "$OUT_MP4" ]]; then
              fail "session $cluster_num: ffmpeg failed (exit $FFMPEG_STATUS) or produced an empty file - nothing deleted from R2, and no marker was advanced past any earlier session in this run."
            fi

            LOCAL_SIZE=$(stat -c%s "$OUT_MP4")
            log "session $cluster_num ffmpeg done: $OUT_MP4 ($LOCAL_SIZE bytes)"

            TS=$(date -u +%s)
            R2_KEY="compressed/${ROOM_ID}/${TS}_${FILE_NAME}"

            log "session $cluster_num: uploading compressed MP4 -> r2://${R2_BUCKET_NAME}/${R2_KEY}"
            if ! rclone_ copyto "$OUT_MP4" "${RCLONE_REMOTE}:${R2_BUCKET_NAME}/${R2_KEY}"; then
              fail "session $cluster_num: upload of compressed MP4 to R2 failed - nothing deleted."
            fi

            REMOTE_SIZE=$(rclone_ size "${RCLONE_REMOTE}:${R2_BUCKET_NAME}/${R2_KEY}" --json 2>/dev/null | jq -r '.bytes // 0')
            if [[ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]]; then
              fail "session $cluster_num: uploaded file size mismatch (local=$LOCAL_SIZE, r2=$REMOTE_SIZE) - nothing deleted."
            fi
            log "session $cluster_num upload verified: $REMOTE_SIZE bytes in R2 match local file"

            RECORDING_ID=$(python3 -c "import uuid;print(uuid.uuid4())")
            REGISTER_PAYLOAD=$(jq -n \
              --arg room_id "$ROOM_ID" \
              --arg recording_id "$RECORDING_ID" \
              --arg file_name "$FILE_NAME" \
              --arg r2_key "$R2_KEY" \
              --argjson file_size_bytes "$LOCAL_SIZE" \
              '{room_id: $room_id, recording_id: $recording_id, file_name: $file_name, r2_key: $r2_key, file_size_bytes: $file_size_bytes}')

            log "session $cluster_num: registering recording with Supabase..."
            REGISTER_RESPONSE=$(curl -sS -X POST "${SUPABASE_URL}/functions/v1/register-recording" \
              -H "Content-Type: application/json" \
              -H "x-hook-secret: ${RECORDER_HOOK_SECRET}" \
              -d "$REGISTER_PAYLOAD")

            if ! jq -e '.ok == true' <<<"$REGISTER_RESPONSE" >/dev/null 2>&1; then
              fail "session $cluster_num: register-recording call failed: $REGISTER_RESPONSE - MP4 IS safely in R2 at ${R2_KEY}, nothing deleted."
            fi
            log "session $cluster_num registered OK: $REGISTER_RESPONSE"
            OUTPUT_SUMMARY+=("${R2_KEY}")

            # Only advance the marker past this session's tracks now that
            # this session has actually fully succeeded (uploaded +
            # registered) - a run that fails partway through a LATER
            # session leaves the marker at whatever the last successful
            # session reached, so a retry only redoes the session(s) that
            # didn't finish, never one that's already safely uploaded and
            # registered.
            CLUSTER_MAX_ENDED="0"
            for e in "${C_ENDS[@]}"; do
              if (( $(echo "$e > $CLUSTER_MAX_ENDED" | bc -l) )); then CLUSTER_MAX_ENDED="$e"; fi
            done
            if (( $(echo "$CLUSTER_MAX_ENDED > $MARKER_FLOOR" | bc -l) )); then
              echo "$CLUSTER_MAX_ENDED" > "${WORKDIR}/new_marker.txt"
              if rclone_ copyto "${WORKDIR}/new_marker.txt" "${RCLONE_REMOTE}:${R2_BUCKET_NAME}/${MARKER_KEY}"; then
                log "advanced last-processed marker for this room to ended_at=${CLUSTER_MAX_ENDED} (after session $cluster_num)"
                MARKER_FLOOR="$CLUSTER_MAX_ENDED"
              else
                log "WARNING: failed to write the last-processed marker after session $cluster_num (non-fatal - a future run for this room may reprocess this session)"
              fi
            fi

            unset CL_IDX C_LOCAL_FILES C_SOURCES C_TYPES C_STARTS C_ENDS
            unset OFFSETS DURATIONS STRETCH STRETCHED_DURATIONS
            unset VLABEL_FULL VLABEL_TILE VLABEL_NARROW VLABEL_WIDE VLABEL_HOLD IS_FS_SOURCE TILE_X TILE_Y
            unset HOLD_END HOLD_DUR FS_IDX_SORTED
          done

          # Belt-and-braces final marker advance: MAX_ENDED_SEEN (tracked
          # during the download loop above, across every parseable item
          # LiveKit reported - including ones that had no downloadable file
          # or no discoverable filename) covers items that could never form
          # part of any session above. Advancing the marker to cover those
          # too, now that every real session has succeeded, stops the
          # pipeline retrying a permanently-broken egress record forever;
          # if MARKER_FLOOR already reached or passed it (the normal case),
          # this is a no-op.
          if (( $(echo "$MAX_ENDED_SEEN > $MARKER_FLOOR" | bc -l) )); then
            echo "$MAX_ENDED_SEEN" > "${WORKDIR}/new_marker.txt"
            if rclone_ copyto "${WORKDIR}/new_marker.txt" "${RCLONE_REMOTE}:${R2_BUCKET_NAME}/${MARKER_KEY}"; then
              log "advanced last-processed marker for this room to ended_at=${MAX_ENDED_SEEN} (covers unusable items too)"
            else
              log "WARNING: failed to write the final catch-all marker (non-fatal)"
            fi
          fi

          # Was TEMPORARILY forced to "true" while actively debugging
          # capture-quality issues (freezing/drift/column/audio-leveling),
          # so a defect in the composited MP4 could be traced back to the
          # exact raw webm/ogg for that track. Now that a run has gone
          # through cleanly with those fixes in place, cleanup is back on -
          # raw per-track R2 objects are deleted right after their
          # session's compressed MP4 is uploaded and registered. Flip this
          # back to "true" if another round of debugging against real raw
          # tracks is needed.
          KEEP_RAW_FILES_FOR_DEBUGGING=false
          if [[ "$KEEP_RAW_FILES_FOR_DEBUGGING" == "true" ]]; then
            log "cleaning up: SKIPPED (KEEP_RAW_FILES_FOR_DEBUGGING=true) - raw per-track files left in R2 for forensics: ${RAW_KEYS[*]}"
          else
            log "cleaning up: deleting raw per-track R2 objects..."
            for key in "${RAW_KEYS[@]}"; do
              rclone_ deletefile "${RCLONE_REMOTE}:${R2_BUCKET_NAME}/${key}" || true
            done
          fi

          SUMMARY_LINE=""
          for k in "${OUTPUT_SUMMARY[@]}"; do
            SUMMARY_LINE="${SUMMARY_LINE} r2://${R2_BUCKET_NAME}/${k}"
          done
          log "==== done: room $ROOM_ID -> ${#OUTPUT_SUMMARY[@]} session(s) uploaded:${SUMMARY_LINE} ===="

      - name: Clean up workdir
        if: always()
        run: rm -rf "${RUNNER_TEMP:?}"/orbit-*_* 2>/dev/null || true

  cleanup_stale_markers:
    # Two schedules now share this workflow (see the `on.schedule` list
    # above), so a schedule firing is only "run this job" when it's the
    # weekly one - github.event.schedule carries the exact cron string
    # that fired. A manual workflow_dispatch run means the same ONLY
    # when room_id was left blank AND cleanup_target picked this job (a
    # run with a room_id given is a normal single-room process request,
    # handled by the `process` job instead).
    if: (github.event_name == 'schedule' && github.event.schedule == '17 3 * * 0') || (github.event_name == 'workflow_dispatch' && github.event.inputs.room_id == '' && github.event.inputs.cleanup_target == 'stale_markers')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      STALE_MARKER_DAYS: ${{ github.event.inputs.stale_marker_days || '90' }}
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        run: |
          : "${R2_ACCOUNT_ID:?missing secret R2_ACCOUNT_ID}"
          : "${R2_ACCESS_KEY_ID:?missing secret R2_ACCESS_KEY_ID}"
          : "${R2_SECRET_ACCESS_KEY:?missing secret R2_SECRET_ACCESS_KEY}"
          : "${R2_BUCKET_NAME:?missing secret R2_BUCKET_NAME}"
          echo "Sweeping stale room markers (>= ${STALE_MARKER_DAYS} days untouched)"

      - name: Install rclone
        run: sudo apt-get update -y && sudo apt-get install -y rclone

      - name: Delete stale room markers
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          log() { echo "[$(date -u +%H:%M:%S)] $*"; }

          WORKDIR="${RUNNER_TEMP}/marker_cleanup_$(date -u +%s)"
          mkdir -p "$WORKDIR"

          RCLONE_REMOTE="nouscomplex_r2_pipeline"
          RCLONE_CONF="${WORKDIR}/rclone.conf"
          cat > "$RCLONE_CONF" <<EOF
          [$RCLONE_REMOTE]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          no_check_bucket = true
          no_head = true
          acl =
          EOF
          chmod 600 "$RCLONE_CONF"
          rclone_() { rclone --config "$RCLONE_CONF" "$@"; }

          # Each room's marker (markers/<room_id>/last_processed_ended_at.txt)
          # is only ever rewritten when that room is actually reprocessed -
          # see the marker comment near the top of the "process" job - so
          # its own last-modified time in R2 IS the true "last time this
          # room produced a new recording" signal, no separate bookkeeping
          # needed. A room that hasn't touched its marker in a very long
          # time (default 90 days) is either a one-off test room or a
          # class that's genuinely done for good, so its marker is safe to
          # delete: the worst case, if that room ID were ever somehow
          # reused after that long, is a single harmless one-time full
          # reprocess (LAST_PROCESSED_ENDED_AT resets to 0 for it) rather
          # than any duplicate/corrupt output - it can never make an
          # already-composited video wrong, only, at most, redo one.
          CUTOFF_EPOCH=$(date -u -d "-${STALE_MARKER_DAYS} days" +%s)
          log "cutoff: markers untouched since before $(date -u -d "@$CUTOFF_EPOCH" '+%Y-%m-%d %H:%M:%SZ') will be deleted"

          MARKERS_JSON=$(rclone_ lsjson "${RCLONE_REMOTE}:${R2_BUCKET_NAME}/markers" --recursive 2>/dev/null || echo '[]')
          TOTAL=$(echo "$MARKERS_JSON" | jq 'length')
          log "found ${TOTAL} marker object(s) under markers/"

          DELETED_COUNT=0
          KEPT_COUNT=0
          while IFS= read -r entry; do
            [[ -z "$entry" ]] && continue
            rel_path=$(echo "$entry" | jq -r '.Path')
            modtime=$(echo "$entry" | jq -r '.ModTime')
            mod_epoch=$(date -u -d "$modtime" +%s 2>/dev/null || echo 0)
            if [[ "$mod_epoch" -gt 0 && "$mod_epoch" -lt "$CUTOFF_EPOCH" ]]; then
              log "deleting stale marker: markers/${rel_path} (last touched ${modtime})"
              if rclone_ deletefile "${RCLONE_REMOTE}:${R2_BUCKET_NAME}/markers/${rel_path}"; then
                DELETED_COUNT=$((DELETED_COUNT + 1))
              else
                log "WARNING: failed to delete markers/${rel_path}"
              fi
            else
              KEPT_COUNT=$((KEPT_COUNT + 1))
            fi
          done < <(echo "$MARKERS_JSON" | jq -c '.[]')

          log "==== done: deleted ${DELETED_COUNT} stale marker(s), kept ${KEPT_COUNT} ===="

  cleanup_expired_recordings:
    # Runs the delete-expired-recordings Edge Function, which deletes any
    # recording from Cloudflare R2 (and soft-deletes its `recordings` row)
    # once the retention period the admin set for that session at
    # scheduling time ("Auto-delete recording from R2 after ___ days")
    # has elapsed. register-recording already computes and stores that
    # expiry as `recordings.delete_after` (recorded_at + the schedule's
    # recording_retention_days) at the moment each recording is
    # registered, so this job's Edge Function just deletes anything past
    # its own delete_after - see
    # supabase/functions/delete-expired-recordings/index.ts.
    #
    # Told apart from the other two triggers the same way
    # cleanup_stale_markers is: a schedule firing only counts when it's
    # the daily one, and a manual run only counts when room_id is blank
    # and cleanup_target picked this job.
    if: (github.event_name == 'schedule' && github.event.schedule == '43 4 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.room_id == '' && github.event.inputs.cleanup_target == 'expired_recordings')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      RECORDER_HOOK_SECRET: ${{ secrets.RECORDER_HOOK_SECRET }}
      RECORDINGS_DRY_RUN: ${{ github.event.inputs.recordings_dry_run || 'false' }}
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        run: |
          : "${SUPABASE_URL:?missing secret SUPABASE_URL}"
          : "${RECORDER_HOOK_SECRET:?missing secret RECORDER_HOOK_SECRET}"
          echo "Sweeping expired recordings (dry_run=${RECORDINGS_DRY_RUN})"

      - name: Call delete-expired-recordings
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          log() { echo "[$(date -u +%H:%M:%S)] $*"; }
          fail() { log "FATAL: $*"; exit 1; }

          DRY_RUN_JSON="false"
          [[ "${RECORDINGS_DRY_RUN}" == "true" ]] && DRY_RUN_JSON="true"

          PAYLOAD=$(jq -n --argjson dry_run "$DRY_RUN_JSON" '{dry_run: $dry_run}')

          log "calling delete-expired-recordings (dry_run=${DRY_RUN_JSON})..."
          HTTP_STATUS=$(curl -sS -o /tmp/cleanup_response.json -w '%{http_code}' -X POST \
            "${SUPABASE_URL}/functions/v1/delete-expired-recordings" \
            -H "Content-Type: application/json" \
            -H "x-hook-secret: ${RECORDER_HOOK_SECRET}" \
            -d "$PAYLOAD") || fail "curl itself failed calling delete-expired-recordings"

          RESPONSE=$(cat /tmp/cleanup_response.json)
          log "HTTP ${HTTP_STATUS}: ${RESPONSE}"

          if [[ "$HTTP_STATUS" != "200" ]] || ! jq -e '.ok == true' <<<"$RESPONSE" >/dev/null 2>&1; then
            fail "delete-expired-recordings call failed (HTTP ${HTTP_STATUS}): ${RESPONSE}"
          fi

          CHECKED=$(jq -r '.checked // 0' <<<"$RESPONSE")
          MATCHED=$(jq -r '.matched_to_a_schedule // 0' <<<"$RESPONSE")
          NO_MATCH=$(jq -r '.skipped_no_retention_match // 0' <<<"$RESPONSE")
          NOT_EXPIRED=$(jq -r '.skipped_not_expired // 0' <<<"$RESPONSE")
          DELETED=$(jq -r '.deleted // 0' <<<"$RESPONSE")
          WOULD_DELETE=$(jq -r '.would_delete // 0' <<<"$RESPONSE")
          ERROR_COUNT=$(jq -r '(.errors // []) | length' <<<"$RESPONSE")

          log "==== done: checked=${CHECKED} matched=${MATCHED} no_retention_match=${NO_MATCH} not_expired=${NOT_EXPIRED} deleted=${DELETED} would_delete=${WOULD_DELETE} errors=${ERROR_COUNT} ===="

          if [[ "$ERROR_COUNT" != "0" ]]; then
            log "per-item errors (non-fatal - these recordings were left untouched, safe to retry next run):"
            jq -r '.errors[]' <<<"$RESPONSE" | while IFS= read -r e; do log "  - $e"; done
          fi
