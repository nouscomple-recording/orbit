name: Process Room Recording

on:
  repository_dispatch:
    types: [process_room]
  workflow_dispatch:
    inputs:
      room_id:
        description: 'PlugNmeet room_id to process (e.g. orbit-<schedule-id>). Leave blank to run the stale-marker cleanup job instead.'
        required: false
      stale_marker_days:
        description: 'Manual cleanup run only (leave room_id blank): delete a room''s last-processed marker if untouched for at least this many days'
        required: false
        default: '90'
  # Sweeps markers/ in R2 once a week and deletes the last-processed
  # marker for any room that has not been processed (i.e. has not
  # produced a single new recording) in a long time - see the cleanup
  # job below for why these accumulate and why deleting them is safe.
  #
  # REMOVED: the every-5-minutes expired-recordings auto-delete sweep
  # (cleanup_expired_recordings job + its cron + the delete-expired-
  # recordings Edge Function) has been taken back out at the user's
  # request - it was deleting recordings 5 minutes after their
  # configured retention, which turned out to be unwanted. register-
  # recording still computes and stores recordings.delete_after on every
  # new recording (harmless, just unused now); nothing currently reads
  # it or deletes anything because of it. To bring auto-delete back:
  # redeploy the delete-expired-recordings Edge Function and re-add a
  # cleanup_expired_recordings job + schedule entry mirroring
  # cleanup_stale_markers below.
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  process:
    # repository_dispatch always means "process this room". A manual
    # workflow_dispatch run means the same ONLY if a room_id was
    # actually given - leaving it blank is how a person triggers the
    # cleanup job below by hand instead, so don't run this job then.
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.room_id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROOM_ID: ${{ github.event.client_payload.room_id || github.event.inputs.room_id }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      LIVEKIT_HOST: ${{ secrets.LIVEKIT_HOST }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      RECORDER_HOOK_SECRET: ${{ secrets.RECORDER_HOOK_SECRET }}
      GROUP_NAME: ${{ github.event.client_payload.group_name }}
      SCHEDULED_TIME: ${{ github.event.client_payload.scheduled_time }}
    steps:
      - name: Validate inputs
        run: |
          if [[ -z "${ROOM_ID:-}" ]]; then
            echo "::error::No room_id provided (repository_dispatch client_payload.room_id or workflow_dispatch input.room_id)"
            exit 1
          fi
          : "${R2_ACCOUNT_ID:?missing secret R2_ACCOUNT_ID}"
          : "${R2_ACCESS_KEY_ID:?missing secret R2_ACCESS_KEY_ID}"
          : "${R2_SECRET_ACCESS_KEY:?missing secret R2_SECRET_ACCESS_KEY}"
          : "${R2_BUCKET_NAME:?missing secret R2_BUCKET_NAME}"
          : "${LIVEKIT_API_KEY:?missing secret LIVEKIT_API_KEY}"
          : "${LIVEKIT_API_SECRET:?missing secret LIVEKIT_API_SECRET}"
          : "${SUPABASE_URL:?missing secret SUPABASE_URL}"
          : "${RECORDER_HOOK_SECRET:?missing secret RECORDER_HOOK_SECRET}"
          echo "Processing room: $ROOM_ID"

      - name: Install ffmpeg, rclone, bc (jq/curl/openssl/python3 already on runner)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg bc python3-pil fonts-dejavu-core
          curl https://rclone.org/install.sh | sudo bash
          python3 -c 'import PIL' || { echo '::error::missing python3-pil'; exit 1; }
          for bin in ffmpeg ffprobe rclone jq curl openssl python3 bc; do
            command -v "$bin" >/dev/null 2>&1 || { echo "::error::missing tool: $bin"; exit 1; }
          done

      # Deliberately -uo pipefail, NOT -e (matches process_room.sh's own
      # `set -u; set -o pipefail` exactly) - several steps below capture a
      # command's exit code into $rc on the line AFTER running it (e.g. the
      # rclone download loop), which only works if a non-zero exit doesn't
      # abort the shell immediately the way GitHub Actions' *default* bash
      # invocation (`bash --noprofile --norc -eo pipefail`) would.
      - name: Composite, compress, upload, register, clean up
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          LIVEKIT_HOST="${LIVEKIT_HOST:-https://meet.nouscomplex.com/livekit}"
          LIVEKIT_HOST="${LIVEKIT_HOST%/}"

          log() { echo "[$(date -u +%H:%M:%S)] $*"; }
          fail() { log "FATAL: $*"; exit 1; }

          log "==== processing room: $ROOM_ID ===="

          WORKDIR="${RUNNER_TEMP}/${ROOM_ID}_$(date -u +%s)"
          mkdir -p "$WORKDIR"
          log "workdir: $WORKDIR"

          # ---- Logo + layout script ----
          # The logo is used for the white start screen and the tile avatars. If it can't be
          # downloaded the layout falls back to the text NOUS - never worth failing a recording.
          curl -sSf --max-time 20 -o "${WORKDIR}/logo.png" "https://orbit.nouscomplex.com/nouscomplex.png" || curl -sSf --max-time 20 -o "${WORKDIR}/logo.png" "https://meet.nouscomplex.com/assets/nouscomplex.png" || { rm -f "${WORKDIR}/logo.png"; log "WARNING: could not download logo - using text fallback"; }
          cat > "${WORKDIR}/orbit_layout.py" <<'ORBIT_LAYOUT_PY'
          #!/usr/bin/env python3
          # Orbit recording layout: header (group + date + speaker), content box on the left (shared screen /
          # whiteboard, otherwise the logo on white), and a column of participant tiles on the right
          # (camera when on, logo avatar when off, name, mic state, speaking highlight).
          #
          # usage: orbit_layout.py MANIFEST WORKDIR TOTAL_DURATION START_IDX CLUSTER GROUP_NAME SCHEDULED_ISO FALLBACK_EPOCH
          # MANIFEST lines (tab separated): key  file  source  type  offset  stretched_duration  duration
          # prints one JSON object: {base_png, inputs[], filter_parts[], final_label, next_idx}
          import sys, os, json, subprocess, re, datetime

          from PIL import Image, ImageDraw, ImageFont

          W, H = 1280, 720
          FRAME = (6, 12, 40)
          TILE_BG = (14, 20, 56)
          WHITE = (255, 255, 255)
          MUTED_TXT = (150, 165, 220)
          GREEN = (34, 197, 94)
          RED = (248, 113, 113)
          HEAD_H = 48
          CARD = (8, 56, 1032, 656)           # x, y, w, h  (content box)
          COL_X, COL_W = 1048, 224            # tile column
          TILE_H, GAP, MAX_TILES = 126, 6, 5
          COL_Y, COL_H = 56, 656

          manifest, workdir, total, start_idx, cluster, group_name, sched_iso, fallback_epoch = sys.argv[1:9]
          total = float(total)
          start_idx = int(start_idx)


          def log(*a):
              print('[layout]', *a, file=sys.stderr)


          def font(size, bold=False):
              for p in ('/usr/share/fonts/truetype/dejavu/DejaVuSans%s.ttf' % ('-Bold' if bold else ''),
                        '/usr/share/fonts/truetype/freefont/FreeSans%s.ttf' % ('Bold' if bold else '')):
                  try:
                      return ImageFont.truetype(p, size)
                  except Exception:
                      pass
              return ImageFont.load_default()


          F_TITLE, F_DATE, F_NAME, F_SMALL, F_BIG = font(20, True), font(15), font(13, True), font(12), font(30, True)


          def fit(draw, text, f, maxw):
              if draw.textlength(text, font=f) <= maxw:
                  return text
              while text and draw.textlength(text + '…', font=f) > maxw:
                  text = text[:-1]
              return text + '…'


          def num(s, d=0.0):
              try:
                  return float(s)
              except Exception:
                  return d


          # ------------------------------------------------------------------ tracks
          tracks = []
          for line in open(manifest, encoding='utf-8'):
              p = line.rstrip('\n').split('\t')
              if len(p) < 7:
                  continue
              key, f, src, typ, off, sdur, dur = p[:7]
              base = os.path.basename(key)
              base = base.rsplit('.', 1)[0] if '.' in base else base
              parts = base.split('__')
              ident = parts[0]
              name, host = '', False
              if len(parts) >= 5 and parts[4]:
                  host = parts[4][0] == 'H'
                  try:
                      name = bytes.fromhex(parts[4][1:]).decode('utf-8', 'replace').strip()
                  except Exception:
                      name = ''
              tracks.append(dict(ident=ident, file=f, src=src, type=typ, off=num(off), sdur=num(sdur), dur=num(dur), name=name, host=host))

          people = {}
          for t in tracks:
              if t['ident'].startswith('orbit-board-') or t['src'] == 'WHITEBOARD':
                  continue
              pp = people.setdefault(t['ident'], dict(ident=t['ident'], name='', host=False, speak=[]))
              if t['name']:
                  pp['name'] = t['name']
              pp['host'] = pp['host'] or t['host']
          for pp in people.values():
              if not pp['name']:
                  pp['name'] = ('Host' if pp['host'] else 'Guest ' + pp['ident'][:4])


          # ------------------------------------------------------------------ audio activity (who speaks when)
          def speaking_intervals(f, off):
              r = subprocess.run(['ffmpeg', '-hide_banner', '-nostats', '-nostdin', '-i', f, '-vn', '-af',
                                  'highpass=f=100,silencedetect=noise=-38dB:d=0.5', '-f', 'null', '-'],
                                 capture_output=True, text=True, stdin=subprocess.DEVNULL)
              err = r.stderr
              dm = re.findall(r'Duration:\s*(\d+):(\d+):([\d.]+)', err)
              dur = (int(dm[0][0]) * 3600 + int(dm[0][1]) * 60 + float(dm[0][2])) if dm else 0.0
              sil, cur = [], None
              for m in re.finditer(r'silence_(start|end):\s*(-?[\d.]+)', err):
                  v = float(m.group(2))
                  if m.group(1) == 'start':
                      cur = max(v, 0.0)
                  elif cur is not None:
                      sil.append((cur, v))
                      cur = None
              if cur is not None:
                  sil.append((cur, dur))
              out, pos = [], 0.0
              for a, b in sil:
                  if a > pos:
                      out.append([pos, a])
                  pos = max(pos, b)
              if dur > pos:
                  out.append([pos, dur])
              merged = []
              for a, b in out:
                  if merged and a - merged[-1][1] < 1.0:
                      merged[-1][1] = b
                  else:
                      merged.append([a, b])
              return [(off + a, off + b) for a, b in merged if b - a >= 0.4]


          for t in tracks:
              if t['src'] == 'MICROPHONE' and t['type'] == 'AUDIO' and t['ident'] in people:
                  iv = speaking_intervals(t['file'], t['off'])
                  people[t['ident']]['speak'] += iv
                  log('mic', t['ident'][:8], people[t['ident']]['name'], '%d speaking interval(s)' % len(iv))


          # ------------------------------------------------------------------ camera on-windows (freeze-trimmed)
          def camera_windows(t):
              off, end = t['off'], t['off'] + t['sdur']
              wins = [(off, end)]
              if t['dur'] <= 0:
                  return wins
              r = subprocess.run(['ffmpeg', '-hide_banner', '-nostats', '-nostdin', '-i', t['file'], '-vf', 'freezedetect=n=-60dB:d=3',
                                  '-an', '-f', 'null', '-'], capture_output=True, text=True, stdin=subprocess.DEVNULL)
              st = [float(x) for x in re.findall(r'freeze_start:\s*([\d.]+)', r.stderr)]
              en = [float(x) for x in re.findall(r'freeze_end:\s*([\d.]+)', r.stderr)]
              while len(en) < len(st):
                  en.append(t['dur'])
              wins, cur = [], 0.0
              for a, b in zip(st, en):
                  if a > cur:
                      wins.append((off + cur, off + a))
                  cur = max(cur, b)
              if cur < t['dur']:
                  wins.append((off + cur, off + t['dur']))
              return [(a, min(b, end)) for a, b in wins if b - a > 0.05]


          # ------------------------------------------------------------------ images / helpers
          logo = None
          lp = os.path.join(workdir, 'logo.png')
          if os.path.exists(lp):
              try:
                  logo = Image.open(lp).convert('RGBA')
              except Exception:
                  logo = None


          def paste_logo(img, cx, cy, maxw, maxh):
              if logo is None:
                  d = ImageDraw.Draw(img)
                  tw = d.textlength('NOUS', font=F_BIG)
                  d.text((cx - tw / 2, cy - 18), 'NOUS', font=F_BIG, fill=(14, 28, 118))
                  return
              r = min(maxw / logo.width, maxh / logo.height)
              lg = logo.resize((max(1, int(logo.width * r)), max(1, int(logo.height * r))), Image.LANCZOS)
              img.paste(lg, (int(cx - lg.width / 2), int(cy - lg.height / 2)), lg)


          def corner_mask(img, box, radius):
              x, y, w, h = box
              m = Image.new('L', (w, h), 0)
              ImageDraw.Draw(m).rounded_rectangle((0, 0, w - 1, h - 1), radius=radius, fill=255)
              inv = Image.eval(m, lambda v: 255 - v)
              img.paste(Image.new('RGBA', (w, h), FRAME + (255,)), (x, y), inv)


          def mic_icon(d, x, y, state):
              col = GREEN if state == 'on' else RED
              d.rounded_rectangle((x + 5, y, x + 10, y + 9), radius=3, fill=col)
              d.arc((x + 2, y + 3, x + 13, y + 13), 0, 180, fill=col, width=2)
              d.line((x + 7, y + 13, x + 7, y + 16), fill=col, width=2)
              d.line((x + 4, y + 16, x + 11, y + 16), fill=col, width=2)
              if state != 'on':
                  d.line((x + 1, y + 17, x + 14, y - 1), fill=col, width=2)


          def date_text():
              try:
                  from zoneinfo import ZoneInfo
                  if sched_iso:
                      dt = datetime.datetime.fromisoformat(sched_iso.replace('Z', '+00:00'))
                  else:
                      dt = datetime.datetime.fromtimestamp(float(fallback_epoch), tz=datetime.timezone.utc)
                  dt = dt.astimezone(ZoneInfo('Asia/Karachi'))
                  return dt.strftime('%a %d %b %Y  ·  ') + dt.strftime('%I:%M %p').lstrip('0')
              except Exception:
                  return ''


          DATE = date_text()
          GROUP = (group_name or 'Orbit Live class').strip()

          # ------------------------------------------------------------------ who / what is on screen, over time
          order = sorted(people.values(), key=lambda p: (not p['host'], p['name'].lower()))
          rank = {p['ident']: k for k, p in enumerate(order)}
          FS_SRC = ('SCREEN_SHARE', 'WHITEBOARD')
          share_tracks = sorted([t for t in tracks if t['type'] == 'VIDEO' and t['src'] in FS_SRC], key=lambda t: t['off'])
          cam_tracks = [t for t in tracks if t['type'] == 'VIDEO' and t['src'] not in FS_SRC and t['ident'] in people]
          for t in cam_tracks:
              t['wins'] = camera_windows(t)


          def inside(wins, x):
              return any(a <= x < b for a, b in wins)


          ev = {0.0, total}
          for p in people.values():
              for a, b in p['speak']:
                  ev.update((a, b))
          for t in cam_tracks:
              for a, b in t['wins']:
                  ev.update((a, b))
          for t in share_tracks:
              ev.update((t['off'], t['off'] + t['sdur']))
          ev = sorted(min(max(x, 0.0), total) for x in ev)

          segs, prev_feat = [], None
          for a, b in zip(ev, ev[1:]):
              if b - a < 0.04:
                  continue
              mid = (a + b) / 2
              share = any(t['off'] <= mid < t['off'] + t['sdur'] for t in share_tracks)
              camset = {t['ident'] for t in cam_tracks if inside(t['wins'], mid)}
              spk = frozenset(i for i, p in people.items() if any(s <= mid < e for s, e in p['speak']))
              if share:
                  key = ('A',) if not camset else ('B',) + tuple(sorted(camset, key=lambda i: rank[i]))
              else:
                  key = ('C',)
              # who fills the big area when nothing is shared: keep the current one while they still talk,
              # else the next speaker with a camera on, else keep the last one (if camera still on), else host / first camera
              feat = None
              if prev_feat in camset and prev_feat in spk:
                  feat = prev_feat
              else:
                  cand = sorted([i for i in spk if i in camset], key=lambda i: rank[i])
                  if cand:
                      feat = cand[0]
                  elif prev_feat in camset:
                      feat = prev_feat
                  elif camset:
                      feat = sorted(camset, key=lambda i: rank[i])[0]
              prev_feat = feat if feat else prev_feat
              segs.append(dict(a=a, b=b, key=key, spk=spk, feat=feat if key[0] == 'C' else None, camset=camset))
          if not segs:
              segs = [dict(a=0.0, b=total, key=('C',), spk=frozenset(), feat=None, camset=set())]


          def stack_cells(plist):
              ov = 0
              if len(plist) > MAX_TILES:
                  keep = MAX_TILES - 1
                  ranked = sorted(plist, key=lambda p: (not p['host'], -sum(b - a for a, b in p['speak'])))
                  chosen = {p['ident'] for p in ranked[:keep]}
                  ov = len(plist) - keep
                  plist = [p for p in plist if p['ident'] in chosen]
              n = len(plist) + (1 if ov else 0)
              stack_h = n * TILE_H + max(n - 1, 0) * GAP
              y0 = COL_Y + max((COL_H - stack_h) // 2, 0)
              cells = [(p, COL_X, y0 + k * (TILE_H + GAP), 0) for k, p in enumerate(plist)]
              if ov:
                  cells.append((None, COL_X, y0 + len(plist) * (TILE_H + GAP), ov))
              return cells


          _cells = {}


          def cells_for(key):
              if key not in _cells:
                  if key[0] == 'C':
                      _cells[key] = stack_cells(order)
                  elif key[0] == 'B':
                      _cells[key] = stack_cells([people[i] for i in key[1:]])
                  else:
                      _cells[key] = []
              return _cells[key]


          def card_for(key):
              return (8, 56, 1264, 656) if key[0] == 'A' else CARD


          def base_image(key):
              img = Image.new('RGBA', (W, H), FRAME + (255,))
              bd = ImageDraw.Draw(img)
              cx, cy, cw, ch = card_for(key)
              bd.rounded_rectangle((cx, cy, cx + cw - 1, cy + ch - 1), radius=12, fill=WHITE)
              paste_logo(img, cx + cw / 2, cy + ch / 2, 420, 220)
              for p, x, y, ov in cells_for(key):
                  bd.rounded_rectangle((x, y, x + COL_W - 1, y + TILE_H - 1), radius=10, fill=TILE_BG)
                  if p:
                      d = 58
                      ax, ay = x + COL_W // 2, y + TILE_H // 2 - 8
                      bd.ellipse((ax - d // 2, ay - d // 2, ax + d // 2, ay + d // 2), fill=WHITE)
                      paste_logo(img, ax, ay, d - 14, d - 22)
                  else:
                      t = '+%d' % ov
                      bd.text((x + COL_W / 2 - bd.textlength(t, font=F_BIG) / 2, y + TILE_H / 2 - 24), t, font=F_BIG, fill=WHITE)
                      t2 = 'more participants'
                      bd.text((x + COL_W / 2 - bd.textlength(t2, font=F_SMALL) / 2, y + TILE_H / 2 + 14), t2, font=F_SMALL, fill=MUTED_TXT)
              return img.convert('RGB')


          def top_image(key, speaking):
              img = Image.new('RGBA', (W, H), (0, 0, 0, 0))
              corner_mask(img, card_for(key), 12)
              for p, x, y, ov in cells_for(key):
                  corner_mask(img, (x, y, COL_W, TILE_H), 10)
              d = ImageDraw.Draw(img)
              d.text((16, 11), fit(d, GROUP, F_TITLE, 420), font=F_TITLE, fill=WHITE)
              right = W - 16
              if DATE:
                  tw = d.textlength(DATE, font=F_DATE)
                  d.text((right - tw, 15), DATE, font=F_DATE, fill=MUTED_TXT)
                  right -= tw + 20
              if speaking:
                  names = [people[i]['name'] for i in sorted(speaking, key=lambda i: rank[i]) if i in people]
                  label = 'Speaking: ' + ', '.join(names[:2]) + (' +%d' % (len(names) - 2) if len(names) > 2 else '')
                  label = fit(d, label, F_NAME, 360)
                  tw = d.textlength(label, font=F_NAME)
                  px = int(right - tw - 40)
                  d.rounded_rectangle((px, 9, px + tw + 40, 39), radius=15, fill=(20, 60, 40), outline=GREEN, width=2)
                  d.ellipse((px + 12, 20, px + 20, 28), fill=GREEN)
                  d.text((px + 28, 15), label, font=F_NAME, fill=WHITE)
              for p, x, y, ov in cells_for(key):
                  if p is None:
                      continue
                  on = p['ident'] in speaking
                  if on:
                      d.rounded_rectangle((x, y, x + COL_W - 1, y + TILE_H - 1), radius=10, outline=GREEN, width=3)
                  label = fit(d, p['name'] + (' (Host)' if p['host'] else ''), F_NAME, COL_W - 56)
                  tw = d.textlength(label, font=F_NAME)
                  bx, by = x + 8, y + TILE_H - 30
                  d.rounded_rectangle((bx, by, bx + tw + 36, by + 22), radius=11, fill=(0, 0, 0, 190))
                  mic_icon(d, bx + 8, by + 3, 'on' if on else 'off')
                  d.text((bx + 26, by + 3), label, font=F_NAME, fill=WHITE)
              return img


          def write_concat(name, items, maker, ext_rgba):
              cache, lines, last = {}, ['ffconcat version 1.0'], None
              for a, b, k in items:
                  if k not in cache:
                      fn = os.path.join(workdir, 'layout_%s_%s_%d.png' % (name, cluster, len(cache)))
                      maker(k).save(fn)
                      cache[k] = fn
                  lines.append("file '%s'" % cache[k])
                  lines.append('duration %.3f' % (b - a))
                  last = cache[k]
              lines.append("file '%s'" % last)
              lp_ = os.path.join(workdir, 'layout_%s_%s.ffconcat' % (name, cluster))
              open(lp_, 'w').write('\n'.join(lines) + '\n')
              return lp_, len(cache)


          def merged(keyfn):
              out = []
              for s in segs:
                  k = keyfn(s)
                  if out and out[-1][2] == k:
                      out[-1][1] = s['b']
                  else:
                      out.append([s['a'], s['b'], k])
              return out


          base_list, nb = write_concat('base', merged(lambda s: s['key']), base_image, False)
          top_list, nt = write_concat('top', merged(lambda s: (s['key'], tuple(sorted(s['spk'])))), lambda k: top_image(k[0], frozenset(k[1])), True)
          log('%d segment(s); %d base image(s), %d chrome image(s)' % (len(segs), nb, nt))


          # ------------------------------------------------------------------ ffmpeg graph
          def tfmt(v):
              s = ('%.3f' % max(v, 0.0)).rstrip('0').rstrip('.')
              return s if s else '0'


          def add_win(lst, a, b):
              if lst and abs(lst[-1][1] - a) < 1e-6:
                  lst[-1][1] = b
              else:
                  lst.append([a, b])


          def expr(wins):
              return '+'.join('between(t,%s,%s)' % (tfmt(a), tfmt(b)) for a, b in wins)


          # share tracks: windows for the narrow box (tiles beside it) and the wide box (no tiles)
          share_uses = []
          for t in share_tracks:
              nar, wid = [], []
              for s in segs:
                  mid = (s['a'] + s['b']) / 2
                  if t['off'] <= mid < t['off'] + t['sdur']:
                      add_win(wid if s['key'][0] == 'A' else nar, s['a'], s['b'])
              share_uses.append((t, nar, wid))

          # camera tracks: big-area windows (featured speaker) and tile windows per tile position
          cam_uses = []
          for t in cam_tracks:
              big, tiles = [], {}
              for s in segs:
                  mid = (s['a'] + s['b']) / 2
                  if not inside(t['wins'], mid):
                      continue
                  if s['feat'] == t['ident']:
                      add_win(big, s['a'], s['b'])
                  for p, x, y, ov in cells_for(s['key']):
                      if p and p['ident'] == t['ident']:
                          add_win(tiles.setdefault((x, y), []), s['a'], s['b'])
              if big or tiles:
                  cam_uses.append((t, big, tiles))

          inputs, parts = [], []
          idx = start_idx
          parts.append('[0:v]fps=30[bg]')
          cur = 'bg'
          n = 0


          def chain(src_idx, off, uses_n, tag):
              """setpts (+ split when the same track is drawn more than once); returns the list of source labels"""
              parts.append('[%d:v]setpts=PTS-STARTPTS+%s/TB%s' % (src_idx, tfmt(off),
                           ('[%s0]' % tag) if uses_n == 1 else ',split=%d%s' % (uses_n, ''.join('[%s%d]' % (tag, k) for k in range(uses_n)))))
              return ['%s%d' % (tag, k) for k in range(uses_n)]


          # 1) featured camera filling the big area
          for t, big, tiles in cam_uses:
              if not big:
                  continue
              inputs_needed = 1 + len(tiles)
              t['_idx'] = idx
              inputs += ['-itsoffset', tfmt(t['off']), '-i', t['file']]
              labs = chain(idx, t['off'], inputs_needed, 'cs%d_' % n)
              t['_labs'] = labs
              lab = labs.pop(0)
              parts.append('[%s]scale=%d:%d:force_original_aspect_ratio=decrease,pad=%d:%d:(ow-iw)/2:(oh-ih)/2:color=black[bg%d]' % (lab, CARD[2], CARD[3], CARD[2], CARD[3], n))
              parts.append("[%s][bg%d]overlay=x=%d:y=%d:enable='%s'[ob%d]" % (cur, n, CARD[0], CARD[1], expr(big), n))
              cur = 'ob%d' % n
              idx += 1
              n += 1

          # 2) shared screen / whiteboard (narrow with tiles, wide without)
          for t, nar, wid in share_uses:
              k = (1 if nar else 0) + (1 if wid else 0)
              if not k:
                  continue
              pad = 'white' if t['src'] == 'WHITEBOARD' else '0x0b1130'
              inputs += ['-itsoffset', tfmt(t['off']), '-i', t['file']]
              labs = chain(idx, t['off'], k, 'ss%d_' % n)
              if nar:
                  lab = labs.pop(0)
                  parts.append('[%s]scale=%d:%d:force_original_aspect_ratio=decrease,pad=%d:%d:(ow-iw)/2:(oh-ih)/2:color=%s[sn%d]' % (lab, CARD[2], CARD[3], CARD[2], CARD[3], pad, n))
                  parts.append("[%s][sn%d]overlay=x=%d:y=%d:enable='%s'[osn%d]" % (cur, n, CARD[0], CARD[1], expr(nar), n))
                  cur = 'osn%d' % n
              if wid:
                  lab = labs.pop(0)
                  parts.append('[%s]scale=1264:656:force_original_aspect_ratio=decrease,pad=1264:656:(ow-iw)/2:(oh-ih)/2:color=%s[sw%d]' % (lab, pad, n))
                  parts.append("[%s][sw%d]overlay=x=8:y=56:enable='%s'[osw%d]" % (cur, n, expr(wid), n))
                  cur = 'osw%d' % n
              idx += 1
              n += 1

          # 3) camera tiles
          for t, big, tiles in cam_uses:
              if not tiles:
                  continue
              if big:
                  labs = t['_labs']            # already split in step 1 (first label used for the big copy)
              else:
                  inputs += ['-itsoffset', tfmt(t['off']), '-i', t['file']]
                  labs = chain(idx, t['off'], len(tiles), 'ct%d_' % n)
                  idx += 1
              for (x, y), wins in tiles.items():
                  lab = labs.pop(0)
                  parts.append('[%s]scale=%d:%d:force_original_aspect_ratio=decrease,pad=%d:%d:(ow-iw)/2:(oh-ih)/2:color=black[tc%d]' % (lab, COL_W, TILE_H, COL_W, TILE_H, n))
                  parts.append("[%s][tc%d]overlay=x=%d:y=%d:enable='%s'[otc%d]" % (cur, n, x, y, expr(wins), n))
                  cur = 'otc%d' % n
                  n += 1

          # 4) header / names / mic icons / speaking highlight on top
          inputs += ['-f', 'concat', '-safe', '0', '-i', top_list]
          parts.append('[%d:v]format=rgba[topc]' % idx)
          parts.append('[%s][topc]overlay=x=0:y=0:format=auto[vout]' % cur)
          idx += 1

          print(json.dumps(dict(base_list=base_list, inputs=inputs, filter_parts=parts, final_label='vout', next_idx=idx)))
          ORBIT_LAYOUT_PY

          RCLONE_REMOTE="nouscomplex_r2_pipeline"
          RCLONE_CONF="${WORKDIR}/rclone.conf"
          cat > "$RCLONE_CONF" <<EOF
          [$RCLONE_REMOTE]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          no_check_bucket = true
          no_head = true
          acl =
          EOF
          chmod 600 "$RCLONE_CONF"
          rclone_() { rclone --config "$RCLONE_CONF" "$@"; }

          # ---- LiveKit Egress API (over the public endpoint - this runner
          # has no access to the Oracle box's localhost) ----
          livekit_jwt() {
            local now exp header_b64 payload_b64 signing_input sig_b64
            now=$(date +%s)
            exp=$((now + 600))
            header_b64=$(printf '{"alg":"HS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            payload_b64=$(python3 -c "
          import json,sys
          print(json.dumps({
            'iss': '$LIVEKIT_API_KEY',
            'sub': 'orbit-recording-pipeline-gha',
            'nbf': $now - 5,
            'exp': $exp,
            'video': {'roomRecord': True},
          }))" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            signing_input="${header_b64}.${payload_b64}"
            sig_b64=$(printf '%s' "$signing_input" | openssl dgst -sha256 -hmac "$LIVEKIT_API_SECRET" -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            printf '%s.%s' "$signing_input" "$sig_b64"
          }

          # Retries transient network failures (e.g. the "Recv failure:
          # Connection reset by peer" seen against the LiveKit host) up to 3
          # times before giving up. Always just returns whatever it got -
          # callers that need to treat an empty/invalid response as fatal
          # check for that explicitly (see the FINAL_JSON validation below),
          # rather than this function silently deciding what's fatal for
          # every caller (StopEgress calls are fine to just skip on failure).
          livekit_call() {
            local method="$1" body="$2" token attempt response rc
            token=$(livekit_jwt)
            for attempt in 1 2 3; do
              response=$(curl -sS --max-time 30 -X POST "${LIVEKIT_HOST}/twirp/livekit.Egress/${method}" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${token}" \
                -d "$body")
              rc=$?
              if [[ $rc -eq 0 && -n "$response" ]] && echo "$response" | jq empty >/dev/null 2>&1; then
                echo "$response"
                return 0
              fi
              log "WARNING: livekit_call $method attempt $attempt/3 failed (curl exit=$rc) or returned invalid JSON - retrying in 3s..."
              sleep 3
            done
            log "WARNING: livekit_call $method failed after 3 attempts - returning empty."
            echo ""
          }

          log "listing egress for room..."
          LIST_JSON=$(livekit_call ListEgress "$(jq -n --arg room_name "$ROOM_ID" '{room_name: $room_name}')")
          echo "$LIST_JSON" > "${WORKDIR}/list_egress_initial.json"

          echo "$LIST_JSON" | jq -c '.items // [] | .[] | select((.ended_at // 0) == 0)' | while read -r item; do
            egress_id=$(echo "$item" | jq -r '.egress_id')
            log "stopping still-active egress $egress_id"
            livekit_call StopEgress "$(jq -n --arg id "$egress_id" '{egress_id: $id}')" > /dev/null || true
          done

          sleep 5

          log "re-listing egress for final file results..."
          FINAL_JSON=$(livekit_call ListEgress "$(jq -n --arg room_name "$ROOM_ID" '{room_name: $room_name}')")
          echo "$FINAL_JSON" > "${WORKDIR}/list_egress_final.json"

          # This call is critical: if it comes back empty/invalid (e.g. a
          # transient network reset talking to the LiveKit host) we must NOT
          # silently treat that the same as "genuinely zero egress jobs" -
          # that previously caused the workflow to exit 0 having done
          # nothing, with no compressed MP4 ever produced and no indication
          # anything went wrong. Fail loudly instead; raw files are
          # untouched in R2 (cleanup never runs before this point), so simply
          # re-running the workflow once LiveKit is reachable again is safe.
          if ! echo "$FINAL_JSON" | jq empty >/dev/null 2>&1; then
            fail "ListEgress (final) returned no valid response after retries - likely a transient network issue reaching LiveKit. Raw per-track files are still safely in R2 (nothing was deleted). Re-run this workflow (Run workflow, not Re-run jobs) once LiveKit is reachable."
          fi

          ITEM_COUNT=$(echo "$FINAL_JSON" | jq '.items // [] | length')
          if [[ "$ITEM_COUNT" -eq 0 ]]; then
            log "no egress jobs found for this room - nothing to process. Exiting cleanly."
            rm -rf "$WORKDIR"
            exit 0
          fi
          log "found $ITEM_COUNT egress job(s)"

          # LiveKit's ListEgress returns EVERY egress job ever run for this
          # room_name, not just ones from the current session - confirmed
          # directly: reprocessing the same test room a second time picked
          # up the first run's already-composited tracks again and merged
          # them into the new video (visible as a bogus "sync anchor" from
          # the earlier run and a total duration spanning both sessions).
          # A marker file in R2 remembers the newest `ended_at` this room
          # has successfully finished processing through, so a re-run (or a
          # genuinely reused room, e.g. a recurring weekly class) only
          # picks up tracks that are actually new. It's written only after
          # a fully successful run below, so a run that fails partway
          # through leaves it untouched and nothing already-seen is lost.
          MARKER_KEY="markers/${ROOM_ID}/last_processed_ended_at.txt"
          LAST_PROCESSED_ENDED_AT="0"
          if rclone_ cat "${RCLONE_REMOTE}:${R2_BUCKET_NAME}/${MARKER_KEY}" > "${WORKDIR}/marker.txt" 2>/dev/null; then
            LAST_PROCESSED_ENDED_AT=$(tr -d '[:space:]' < "${WORKDIR}/marker.txt")
            [[ -z "$LAST_PROCESSED_ENDED_AT" ]] && LAST_PROCESSED_ENDED_AT="0"
          fi
          log "last-processed marker for this room: ended_at <= ${LAST_PROCESSED_ENDED_AT} already handled"
          MAX_ENDED_SEEN="0"

          extract_result_key() {
            echo "$1" | jq -r '(.file_results // [])[0] | (.filename // .file // .location // empty)'
          }

          normalize_epoch_seconds() {
            local v="$1"
            if [[ -z "$v" || "$v" == "0" ]]; then echo 0; return; fi
            if (( v > 1000000000000 )); then
              echo "scale=3; $v / 1000000000" | bc
            else
              echo "$v"
            fi
          }

          # ffmpeg's atempo filter only accepts a tempo change within
          # [0.5, 2.0] per stage - anything outside that (which a badly
          # drifted track can easily need) has to be expressed as a chain of
          # in-range stages whose product is the real target.
          build_atempo_chain() {
            local target="$1" chain=""
            while (( $(echo "$target > 2.0" | bc -l) )); do
              chain="${chain}atempo=2.0,"
              target=$(echo "scale=6; $target / 2.0" | bc)
            done
            while (( $(echo "$target < 0.5" | bc -l) )); do
              chain="${chain}atempo=0.5,"
              target=$(echo "scale=6; $target / 0.5" | bc)
            done
            chain="${chain}atempo=${target}"
            echo "$chain"
          }

          # bc prints a fraction under 1 with no leading digit before the
          # decimal point (e.g. ".506006", or "-.5"), which is perfectly
          # valid to bc itself and to ffmpeg filter expressions like
          # between(t,.5,1) - but ffmpeg's *duration*-typed CLI/filter
          # options (-itsoffset, tpad's stop_duration, -t, etc.) are parsed
          # with the stricter av_parse_time, which rejects a bare leading
          # dot outright ("Unable to parse option value ... as duration"),
          # aborting the whole ffmpeg run with no composite produced at
          # all. Anywhere a bc result feeds one of those options, it has to
          # go through this first.
          fix_duration_leading_zero() {
            local v="$1"
            case "$v" in
              .*) echo "0${v}" ;;
              -.*) echo "-0${v#-}" ;;
              *) echo "$v" ;;
            esac
          }

          declare -a RAW_KEYS=()
          declare -a LOCAL_FILES=()
          declare -a SOURCES=()
          declare -a TYPES=()
          declare -a STARTS=()
          declare -a ENDS=()

          echo "$FINAL_JSON" | jq -c '.items // [] | .[]' > "${WORKDIR}/items.ndjson"
          while IFS= read -r item; do
            if ! echo "$item" | jq empty >/dev/null 2>&1; then
              # This item's own JSON is not even parseable - distinct from
              # "parsed fine, just no filename field" below. Seen exactly
              # once in practice, caused by a subprocess earlier in this
              # same loop iteration reading from stdin and stealing bytes
              # from this file out from under `read` (see the -nostdin
              # comment on the normalization ffmpeg call above) - logging
              # the length here is a quick way to confirm/rule that out if
              # it ever recurs.
              log "WARNING: a line from items.ndjson was not valid JSON (length ${#item} chars) - skipping it. Raw: $item"
              continue
            fi
            started_raw=$(echo "$item" | jq -r '.started_at // 0')
            started=$(normalize_epoch_seconds "$started_raw")
            ended_raw=$(echo "$item" | jq -r '.ended_at // 0')
            ended=$(normalize_epoch_seconds "$ended_raw")

            # Track the newest ended_at across every item this run has seen
            # at all (whether or not it ends up used), so the marker
            # written at the end of a successful run reflects everything
            # LiveKit reported this time - see the marker comment above.
            if [[ "$ended" != "0" ]] && (( $(echo "$ended > $MAX_ENDED_SEEN" | bc -l) )); then
              MAX_ENDED_SEEN="$ended"
            fi
            if [[ "$ended" != "0" ]] && (( $(echo "$ended <= $LAST_PROCESSED_ENDED_AT" | bc -l) )); then
              skip_track_id=$(echo "$item" | jq -r '.track.track_id // "unknown"')
              log "skipping already-processed egress (ended_at=$ended <= marker=$LAST_PROCESSED_ENDED_AT) - track_id=$skip_track_id"
              continue
            fi

            key=$(extract_result_key "$item")
            if [[ -z "$key" ]]; then
              log "WARNING: an egress item had no discoverable output filename - skipping it. Full item (pretty-printed so nothing gets lost on one huge line):"
              echo "$item" | jq .
              continue
            fi

            base=$(basename "$key")
            base_noext="${base%.*}"
            identity=$(echo "$base_noext" | awk -F'__' '{print $1}')
            source_v=$(echo "$base_noext" | awk -F'__' '{print $2}')
            type_v=$(echo "$base_noext" | awk -F'__' '{print $3}')

            local_file="${WORKDIR}/raw_$(echo "$base" | tr -c 'a-zA-Z0-9._-' '_')"
            log "downloading r2://${R2_BUCKET_NAME}/${key} -> ${local_file}"
            rclone_ copyto "${RCLONE_REMOTE}:${R2_BUCKET_NAME}/${key}" "$local_file"
            rc=$?
            if [[ $rc -ne 0 || ! -s "$local_file" ]]; then
              log "WARNING: could not download $key (rclone exit=$rc) - skipping this track"
              rm -f "$local_file"
              continue
            fi

            # Normalize every VIDEO track to a constant resolution/frame rate
            # BEFORE it ever reaches the main compositing filter graph.
            # Root cause this fixes: a LiveKit camera Track Egress can
            # genuinely change resolution mid-recording (observed directly:
            # one participant's raw camera .webm was 120x90 for the first
            # ~290s, then jumped to 640x480 for the rest - almost certainly
            # a simulcast layer switch as their bandwidth/CPU conditions
            # changed). ffmpeg's scale/overlay filters are built assuming a
            # fixed input size for the life of the stream; they don't
            # recover cleanly from a resolution change partway through, and
            # in a complex multi-stage overlay graph like this one, that
            # single input a breaking silently took down that participant's
            # WHOLE remaining contribution to the composite - both their
            # corner tile during a screen-share/whiteboard window and their
            # full-frame view afterwards, leaving a plain blank canvas
            # instead where their camera should have been. Re-encoding each
            # video track once, up front, to a fixed 1280x720/30fps here
            # means the main filter graph never sees a resolution change at
            # all, regardless of what the raw capture did.
            if [[ "$type_v" == "VIDEO" ]]; then
              norm_file="${local_file}_norm.mp4"
              # -nostdin (and redirecting stdin from /dev/null as a belt-
              # and-braces second layer) is NOT optional here: this whole
              # block runs inside `while read -r item; do ... done <
              # items.ndjson`, so without it ffmpeg inherits that same
              # loop's stdin - i.e. the *file descriptor reading
              # items.ndjson* - and its usual "poll stdin for interactive
              # keypresses" behavior silently steals bytes from whatever
              # item comes next in that file. That exact bug was caught
              # live: it corrupted the start of the next egress item's JSON
              # (the item literally started reading mid-way through, e.g.
              # from `Nw","room_id":...` instead of `{"egress_id":"EG_...
              # Nw","room_id":...`), which made `extract_result_key` fail
              # on perfectly valid data and silently drop that track (once
              # a stale duplicate recording, once a real screen-share) -
              # nothing to do with LiveKit or the JSON shape, purely this
              # missing flag.
              # crf 16 (not the 20 used for the final deliverable) because
              # this file is a throwaway intermediate that the main
              # compositing pass below will re-encode again at crf 20 - two
              # lossy generations in a row otherwise compounds more visible
              # quality loss than a single pass, and the extra disk space
              # here costs nothing since it's deleted with the rest of the
              # workdir at the end of the job.
              if ffmpeg -y -hide_banner -loglevel warning -nostdin -i "$local_file" \
                   -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30" \
                   -c:v libx264 -preset veryfast -crf 16 -pix_fmt yuv420p -an \
                   "$norm_file" </dev/null && [[ -s "$norm_file" ]]; then
                log "normalized $key to constant 1280x720/30fps -> ${norm_file}"
                local_file="$norm_file"
              else
                log "WARNING: normalization failed for $key - using raw file as-is (may hit the mid-stream-resolution-change bug if this file has one)"
                rm -f "$norm_file"
              fi
            fi

            RAW_KEYS+=("$key")
            LOCAL_FILES+=("$local_file")
            SOURCES+=("$source_v")
            TYPES+=("$type_v")
            STARTS+=("$started")
            ENDS+=("$ended")
          done < "${WORKDIR}/items.ndjson"

          if [[ "${#LOCAL_FILES[@]}" -eq 0 ]]; then
            log "no raw files could be downloaded - nothing to compress."
            exit 0
          fi

          # ---- Whiteboard: turn the saved drawing events into video ----
          # The host's browser sends the board's drawing events to the server while the board is
          # open (nothing is recorded as video on the host's device or the server). Here they are
          # replayed in a headless browser into one video per "board open" period, and added to the
          # track lists as WHITEBOARD tracks, exactly like a shared screen. Once every session below
          # is registered, the saved events are deleted from the database.
          BOARD_SID="${ROOM_ID#olive-}"
          BOARD_REPLAY_OK=false
          BOARD_HAS_VIDEO=false
          for s_ in "${SOURCES[@]}"; do [[ "$s_" == "WHITEBOARD" ]] && BOARD_HAS_VIDEO=true; done
          if [[ "$BOARD_HAS_VIDEO" == "true" ]]; then
            log "whiteboard: a recorded board video already exists for this room - not replaying events"
          else
            BOARD_JSON="${WORKDIR}/board_events.json"
            BOARD_HTTP=$(curl -sS -o "$BOARD_JSON" -w '%{http_code}' -X POST "${SUPABASE_URL}/functions/v1/board-events" \
              -H "Content-Type: application/json" -H "x-hook-secret: ${RECORDER_HOOK_SECRET}" \
              -d "$(jq -n --arg s "$BOARD_SID" '{action:"get", schedule_id:$s}')" || echo 000)
            if [[ "$BOARD_HTTP" == "200" ]] && jq -e '.ok == true' "$BOARD_JSON" >/dev/null 2>&1; then
              BOARD_COUNT=$(jq '.events | length' "$BOARD_JSON")
              log "whiteboard: fetched ${BOARD_COUNT} saved drawing event(s)"
              if [[ "$BOARD_COUNT" -eq 0 ]]; then
                BOARD_REPLAY_OK=true
              else
                BOARD_MIN=$(printf '%s\n' "${STARTS[@]}" | awk '$1>0' | sort -g | head -1)
                BOARD_MAX=$(printf '%s\n' "${ENDS[@]}" | sort -g | tail -1)
                PWDIR="${WORKDIR}/pw"; mkdir -p "$PWDIR"
                cat > "${PWDIR}/board_replay.mjs" <<'BOARD_REPLAY_EOF'
          // Replays whiteboard events (saved by the live class page) into one mp4 per "board open" period.
          //   node board_replay.mjs <events.json> <outdir> [earliestTrackStartEpochSec] [latestTrackEndEpochSec]
          // Writes <outdir>/board_N.mp4 and <outdir>/board_tracks.json  [{file,start,end}]  (epoch seconds)
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { createRequire } from 'node:module';

          const [evFile, outDir, minStartArg, maxEndArg] = process.argv.slice(2);
          if (!evFile || !outDir) { console.error('usage: board_replay.mjs events.json outdir [minStart maxEnd]'); process.exit(2); }
          const W = 1280, H = 720, GRID = 100, FADE = 900;

          let chromium;
          try { ({ chromium } = createRequire(import.meta.url)('playwright')); }
          catch { ({ chromium } = await import(process.env.PLAYWRIGHT_ENTRY || 'playwright')); }

          const raw = JSON.parse(fs.readFileSync(evFile, 'utf8'));
          const events = (Array.isArray(raw) ? raw : raw.events || []).filter(e => e && typeof e.a === 'number' && isFinite(e.a))
            .map((e, i) => [e, i]).sort((x, y) => x[0].a - y[0].a || x[1] - y[1]).map(x => x[0]);
          fs.mkdirSync(outDir, { recursive: true });
          if (!events.length) { fs.writeFileSync(path.join(outDir, 'board_tracks.json'), '[]'); console.log('no board events'); process.exit(0); }

          const PAGE = `<!doctype html><meta charset="utf-8"><body style="margin:0"><canvas id="c" width="${W}" height="${H}"></canvas><script>
          const W=${W},H=${H},FADE=${FADE};
          const TYPES=['pen','line','arrow','rect','ellipse','diamond','text'];
          const num=v=>(typeof v==='number'&&isFinite(v))?v:0;
          const color=c=>(typeof c==='string'&&/^#[0-9a-f]{3,8}$/i.test(c))?c:'#0b1647';
          function clean(o){
            if(!o||!TYPES.includes(o.ty)||typeof o.id!=='string'||o.id.length>40) return null;
            const r={id:o.id,ty:o.ty,c:color(o.c),w:Math.min(40,Math.max(1,num(o.w)||4)),f:!!o.f,ox:num(o.ox),oy:num(o.oy),by:String(o.by||'').slice(0,60)};
            if(o.ty==='pen') r.p=(Array.isArray(o.p)?o.p:[]).slice(0,8000).map(num);
            else if(o.ty==='text'){r.x=num(o.x);r.y=num(o.y);r.s=String(o.s||'').slice(0,500);r.sz=Math.min(300,Math.max(10,num(o.sz)||28));}
            else{r.x=num(o.x);r.y=num(o.y);r.x2=num(o.x2);r.y2=num(o.y2);}
            return r;
          }
          let objs=[],map=new Map(),open=false,view={x:0,y:0,k:1,w:W,h:H},lasers=new Map();
          const add=o=>{if(map.has(o.id))return false;objs.push(o);map.set(o.id,o);return true;};
          const del=id=>{const o=map.get(id);if(!o)return;map.delete(id);objs.splice(objs.indexOf(o),1);};
          function apply(ev){
            if(ev.s){const s=ev.s;if(s.r){objs=[];map.clear();open=!!s.open;}for(const r of (s.o||[])){const c=clean(r);if(c)add(c);}return;}
            if(ev.v){view=ev.v;return;}
